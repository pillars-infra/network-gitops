apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeros-public-forward-controller
  namespace: ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routeros-public-forward-controller
  template:
    metadata:
      annotations:
        networking.re8ch.com/config-revision: outer-sni-v1
        networking.re8ch.com/return-policy-code-sha256: 11829925d743df135251f858261a14019c418ce026d54202c9464b66e37a986f
      labels:
        app.kubernetes.io/name: routeros-public-forward-controller
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python3
        - /config/reconcile.py
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        name: reconciler
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - import pathlib,time; assert time.time()-pathlib.Path('/tmp/routeros-public-forward-ready').stat().st_mtime
              < 90
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /credential
          name: credential
          readOnly: true
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: routeros-public-forward-controller
        name: config
      - name: credential
        secret:
          secretName: mikrotik-routeros-admin
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeros-transit-controller
  namespace: ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routeros-transit-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routeros-transit-controller
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python3
        - /config/routeros_transit.py
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        name: reconciler
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - import pathlib,time; assert time.time()-pathlib.Path('/tmp/routeros-transit-ready').stat().st_mtime
              < 90
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 150m
            memory: 96Mi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /credential
          name: credential
          readOnly: true
        - mountPath: /tmp
          name: tmp
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations:
      - operator: Exists
      volumes:
      - configMap:
          name: routeros-transit-controller-m4d4tm44fd
        name: config
      - name: credential
        secret:
          items:
          - key: username
            path: username
          - key: password
            path: password
          secretName: mikrotik-routeros-admin
      - emptyDir:
          medium: Memory
          sizeLimit: 8Mi
        name: tmp
---
