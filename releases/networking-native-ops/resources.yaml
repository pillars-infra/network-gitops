  observe.py: "#!/usr/bin/env python3\n\"\"\"Read-only, destination-scoped RouterOS\
    \ diagnostics through the existing owner.\"\"\"\nimport argparse\nimport ipaddress\n\
    import json\nfrom urllib.parse import urlencode\n\nSOURCES = ipaddress.ip_network('10.68.9.0/24')\n\
    DESTINATIONS = {'101.34.217.95', '124.220.77.50', '1.14.174.244'}\nNAT_FIELDS\
    \ = ('chain', 'action', 'src-address', 'dst-address', 'protocol', 'dst-port',\n\
    \              'to-addresses', 'to-ports', 'in-interface', 'out-interface', 'disabled')\n\
    ROUTE_FIELDS = ('dst-address', 'gateway', 'active', 'routing-table', 'distance',\
    \ 'dynamic')\nCONNECTION_FIELDS = ('src-address', 'dst-address', 'reply-src-address',\
    \ 'reply-dst-address',\n                     'protocol', 'srcnat', 'dstnat', 'seen-reply',\
    \ 'assured')\n\n\ndef validate(source, destination, source_port):\n    source\
    \ = str(ipaddress.IPv4Address(source))\n    destination = str(ipaddress.IPv4Address(destination))\n\
    \    if ipaddress.ip_address(source) not in SOURCES or destination not in DESTINATIONS:\n\
    \        raise ValueError('diagnostic scope is not reviewed')\n    if not 1024\
    \ <= source_port <= 65535:\n        raise ValueError('invalid diagnostic source\
    \ port')\n    return source, destination\n\n\ndef projected(row, fields):\n  \
    \  # Only printable bounded scalar fields, never comments, auth or arbitrary response\
    \ keys.\n    return {key: str(row[key]) for key in fields if key in row and\n\
    \            isinstance(row[key], (str, bool, int)) and len(str(row[key])) <=\
    \ 160 and\n            all(32 <= ord(char) < 127 for char in str(row[key]))}\n\
    \n\ndef get_rows(router, path, fields, filters=None):\n    query = {'.proplist':\
    \ ','.join(fields)}\n    query.update(filters or {})\n    rows = router.request(path\
    \ + '?' + urlencode(query), method='GET')\n    if not isinstance(rows, list) or\
    \ any(not isinstance(row, dict) for row in rows):\n        raise ValueError('unexpected\
    \ RouterOS response shape')\n    return rows\n\n\ndef covers(value, address):\n\
    \    if not value:\n        return True\n    try:\n        return ipaddress.ip_address(address)\
    \ in ipaddress.ip_network(value, strict=False)\n    except ValueError:\n     \
    \   return None\n\n\ndef port_covers(value, port):\n    if not value:\n      \
    \  return True\n    try:\n        for part in value.split(','):\n            bounds\
    \ = [int(item) for item in part.split('-')]\n            if len(bounds) == 1 and\
    \ bounds[0] == port:\n                return True\n            if len(bounds)\
    \ == 2 and bounds[0] <= port <= bounds[1]:\n                return True\n    \
    \    return False\n    except (ValueError, AttributeError):\n        return None\n\
    \n\ndef observe(router, source, destination, source_port):\n    source, destination\
    \ = validate(source, destination, source_port)\n    routes = get_rows(router,\
    \ '/ip/route', ROUTE_FIELDS)\n    relevant_routes = []\n    for row in routes:\n\
    \        if covers(row.get('dst-address'), source) is True:\n            relevant_routes.append(projected(row,\
    \ ROUTE_FIELDS))\n    nat = get_rows(router, '/ip/firewall/nat', NAT_FIELDS)\n\
    \    relevant_nat = []\n    unknown_selectors = 0\n    for row in nat:\n     \
    \   if str(row.get('disabled', 'false')).lower() == 'true':\n            continue\n\
    \        if row.get('protocol') not in (None, '', 'udp', 'tcp'):\n           \
    \ continue\n        # Report possible matching rules in original order. Unknown/range/inverted\n\
    \        # selectors remain candidates, not proof that a particular rule matched.\n\
    \        match = [covers(row.get('src-address'), source), covers(row.get('dst-address'),\
    \ destination),\n                 port_covers(row.get('dst-port'), 53)]\n    \
    \    reverse = [covers(row.get('src-address'), destination), covers(row.get('dst-address'),\
    \ source),\n                   port_covers(row.get('dst-port'), source_port)]\n\
    \        if False in match and False in reverse:\n            continue\n     \
    \   unknown_selectors += int(None in match or None in reverse)\n        relevant_nat.append(projected(row,\
    \ NAT_FIELDS))\n    filters = {'src-address': source + ':' + str(source_port),\
    \ 'dst-address': destination + ':53',\n               'protocol': 'udp'}\n   \
    \ connections = get_rows(router, '/ip/firewall/connection', CONNECTION_FIELDS,\
    \ filters)\n    # Verify exact scope again even if the provider ignores URL filters.\
    \ Never\n    # output an unrelated connection or treat an absent/expired entry\
    \ as success.\n    selected = [projected(row, CONNECTION_FIELDS) for row in connections\n\
    \                if all(str(row.get(key, '')) == value for key, value in filters.items())]\n\
    \    return {'definition': 'routeros-public-dns-return-v1', 'source': source,\n\
    \            'destination': destination, 'sourcePort': source_port, 'destinationPort':\
    \ 53,\n            'routesCoveringSource': relevant_routes, 'possibleNatRulesInOrder':\
    \ relevant_nat,\n            'unknownNatSelectors': unknown_selectors, 'exactUdpConnections':\
    \ selected,\n            'connectionObservation': 'present' if selected else 'absent-or-expired',\n\
    \            'claim': 'read-only snapshot; rule candidates are not packet-hit\
    \ proof'}\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument('--source-address', required=True)\n    parser.add_argument('--destination-address',\
    \ required=True)\n    parser.add_argument('--source-port', required=True, type=int)\n\
    \    args = parser.parse_args(argv)\n    source, destination = validate(args.source_address,\
    \ args.destination_address, args.source_port)\n    # Import is safe: reviewed\
    \ owner has a guarded __main__. Reuse its mounted\n    # credential reference\
    \ and HTTP adapter; never print/read credentials here.\n    from reconcile import\
    \ Router\n    try:\n        result = observe(Router('192.168.88.1'), source, destination,\
    \ args.source_port)\n    except Exception as error:\n        print(json.dumps({'state':\
    \ 'failed', 'errorType': type(error).__name__}))\n        return 1\n    print(json.dumps(result,\
    \ sort_keys=True))\n    return 0\n\n\nif __name__ == '__main__':\n    raise SystemExit(main())\n"
  pod_return_policy.py: "\"\"\"Bounded pool-family admission for the existing R640\
    \ RouterOS peer.\"\"\"\nimport ipaddress\nimport re\nfrom urllib.parse import\
    \ urlencode\n\nOWNER = 'RE8CH GITOPS R640 POD RETURN'\nCHAIN = 're8ch-v2-r640-in'\n\
    TABLE = 're8ch-service-fast'\nPEER = '192.168.88.251'\nASN = '4200000128'\nLOCAL\
    \ = '192.168.88.1'\nNATIVE = ipaddress.ip_network('10.64.0.0/12')\n# Retain failed\
    \ refreshes in-process; startup refresh covers interrupted writes.\n_refresh_pending\
    \ = True\n\n\ndef validate_policy(policy):\n    if not policy:\n        return\
    \ []\n    if (policy.get('peerAddress') != PEER or str(policy.get('peerASN'))\
    \ != ASN or\n            policy.get('localAddress') != LOCAL or policy.get('filterChain')\
    \ != CHAIN or\n            policy.get('routingTable') != TABLE or policy.get('commentPrefix')\
    \ != OWNER):\n        raise ValueError('Pod-return authority differs')\n    refs\
    \ = policy.get('poolRefs', [])\n    pools = policy.get('approvedPools', [])\n\
    \    if not refs or len(set(refs)) != len(refs) or not pools:\n        raise ValueError('reviewed\
    \ pool projection is required')\n    networks, seen = [], set()\n    for pool\
    \ in pools:\n        network = ipaddress.ip_network(pool['cidr'], strict=True)\n\
    \        if (pool.get('poolRef') not in refs or pool.get('maskSize') != 24 or\n\
    \                network.version != 4 or not network.subnet_of(NATIVE) or network.prefixlen\
    \ > 24 or\n                any(network.overlaps(prior) for prior in networks)):\n\
    \            raise ValueError('Pod-return pool projection differs')\n        networks.append(network)\n\
    \        seen.add(pool['poolRef'])\n    if seen != set(refs):\n        raise ValueError('incomplete\
    \ pool projection')\n    return sorted(str(network) for network in networks)\n\
    \n\ndef identity(value):\n    if not isinstance(value, str) or not re.fullmatch(r'\\\
    *[0-9a-fA-F]+', value):\n        raise ValueError('exact RouterOS object identity\
    \ is required')\n    return value\n\n\ndef enabled(row):\n    return str(row.get('disabled',\
    \ 'false')).lower() not in {'true', 'yes'}\n\n\ndef peer_matches(row):\n    return\
    \ (str(row.get('remote.address', '')).split('/')[0] == PEER and\n            str(row.get('remote.as'))\
    \ == ASN and row.get('local.address') == LOCAL)\n\n\ndef rows(router, path):\n\
    \    fields = {\n        '/routing/bgp/connection': ('.id','name','remote.address','remote.as','local.address','input.filter','routing-table','disabled'),\n\
    \        '/routing/table': ('.id','name','fib','disabled'),\n        '/routing/filter/rule':\
    \ ('.id','chain','rule','comment','disabled'),\n        '/routing/rule': ('.id','dst-address','src-address','interface','routing-mark','action','table','comment','disabled'),\n\
    \        '/routing/bgp/session': ('.id','name','remote.address','remote.as','local.address','established','remote.capabilities'),\n\
    \    }[path]\n    result = router.request(path + '?' + urlencode({'.proplist':\
    \ ','.join(fields)}))\n    if not isinstance(result, list) or any(not isinstance(row,\
    \ dict) for row in result):\n        raise ValueError('unexpected RouterOS observation\
    \ shape')\n    return [{key: value for key, value in row.items() if key in fields}\
    \ for row in result]\n\n\ndef plan_pod_return(router, policy):\n    aggregates\
    \ = validate_policy(policy)\n    if not policy:\n        return {'actions': [],\
    \ 'refresh': None}\n    connections = rows(router, '/routing/bgp/connection')\n\
    \    active = [row for row in connections if enabled(row) and row.get('input.filter')\
    \ == CHAIN]\n    if len(active) != 1 or not peer_matches(active[0]) or active[0].get('routing-table')\
    \ != TABLE:\n        raise ValueError('dedicated R640 peer differs')\n    tables\
    \ = rows(router, '/routing/table')\n    if len([row for row in tables if row.get('name')\
    \ == TABLE]) != 1:\n        raise ValueError('existing routing table differs')\n\
    \    filters = rows(router, '/routing/filter/rule')\n    routes = rows(router,\
    \ '/routing/rule')\n    rejects = [row for row in filters if row.get('chain')\
    \ == CHAIN and enabled(row) and row.get('rule', '').strip() == 'reject']\n   \
    \ anchors = [row for row in routes if enabled(row) and row.get('dst-address')\
    \ == '10.42.0.0/16'\n               and row.get('action') == 'lookup' and row.get('table')\
    \ == TABLE\n               and not any(row.get(key) for key in ('src-address','interface','routing-mark'))]\n\
    \    if len(rejects) != 1 or len(anchors) != 1:\n        raise ValueError('existing\
    \ admission or routing anchor differs')\n    # Existing legacy/VIP rules stay\
    \ untouched. Reject a different chain sharing\n    # our namespace rather than\
    \ moving, taking over or deleting foreign rules.\n    for row in filters:\n  \
    \      if str(row.get('comment') or '').startswith(OWNER + ' ') and row.get('chain')\
    \ != CHAIN:\n            raise ValueError('filter ownership conflict')\n    for\
    \ row in routes:\n        if str(row.get('comment') or '').startswith(OWNER +\
    \ ' ') and row.get('table') != TABLE:\n            raise ValueError('routing-rule\
    \ ownership conflict')\n    actions = []\n    import_changed = False\n    for\
    \ path, observed, anchor, mode in [\n            ('/routing/filter/rule', filters,\
    \ rejects[0], 'import'),\n            ('/routing/rule', routes, anchors[0], 'lookup')]:\n\
    \        desired = []\n        for aggregate in aggregates:\n            comment\
    \ = OWNER + ' ' + mode + ' ' + aggregate\n            if mode == 'import':\n \
    \               body = {'chain': CHAIN, 'rule': 'if (dst in ' + aggregate + '\
    \ && dst-len == 24) { accept }',\n                        'comment': comment,\
    \ 'disabled': 'false'}\n            else:\n                body = {'dst-address':\
    \ aggregate, 'action': 'lookup', 'table': TABLE,\n                        'comment':\
    \ comment, 'disabled': 'false'}\n            desired.append(comment)\n       \
    \     prior = [row for row in observed if row.get('comment') == comment]\n   \
    \         if len(prior) > 1:\n                raise ValueError('duplicate owned\
    \ policy rule')\n            if not prior:\n                actions.append(('create',\
    \ path, None, body, identity(anchor['.id'])))\n                import_changed\
    \ |= mode == 'import'\n            else:\n                row = prior[0]\n   \
    \             if any(str(row.get(key, 'false' if key == 'disabled' else '')) !=\
    \ value for key, value in body.items()):\n                    actions.append(('patch',\
    \ path, identity(row['.id']), body, None))\n                    import_changed\
    \ |= mode == 'import'\n                if observed.index(row) > observed.index(anchor):\n\
    \                    actions.append(('move', path, identity(row['.id']), None,\
    \ identity(anchor['.id'])))\n                    import_changed |= mode == 'import'\n\
    \        for row in observed:\n            if str(row.get('comment') or '').startswith(OWNER\
    \ + ' ' + mode + ' ') and row['comment'] not in desired:\n                actions.append(('delete',\
    \ path, identity(row['.id']), None, None))\n                import_changed |=\
    \ mode == 'import'\n    refresh = None\n    if import_changed or _refresh_pending:\n\
    \        sessions = rows(router, '/routing/bgp/session')\n        selected = [row\
    \ for row in sessions if peer_matches(row) and\n                    str(row.get('established',\
    \ '')).lower() == 'true' and\n                    'rr' in str(row.get('remote.capabilities',\
    \ '')).split(',')]\n        if len(selected) != 1 or not selected[0].get('.id'):\n\
    \            raise ValueError('fresh exact route-refresh session is unavailable')\n\
    \        refresh = identity(selected[0]['.id'])\n    return {'actions': actions,\
    \ 'refresh': refresh}\n\n\ndef apply_pod_return(router, plan):\n    global _refresh_pending\n\
    \    if plan['refresh']:\n        _refresh_pending = True\n    for action, path,\
    \ row_id, body, anchor in plan['actions']:\n        if action == 'create':\n \
    \           row = router.request(path, 'PUT', body)\n            if not isinstance(row,\
    \ dict) or not row.get('.id'):\n                raise ValueError('created policy\
    \ identity is unavailable')\n            router.request(path + '/move', 'POST',\
    \ {'numbers': identity(row['.id']), 'destination': identity(anchor)})\n      \
    \  elif action == 'patch':\n            router.request(path + '/' + identity(row_id),\
    \ 'PATCH', body)\n        elif action == 'move':\n            router.request(path\
    \ + '/move', 'POST', {'numbers': identity(row_id), 'destination': identity(anchor)})\n\
    \        elif action == 'delete':\n            router.request(path + '/' + identity(row_id),\
    \ 'DELETE')\n        else:\n            raise ValueError('unknown policy action')\n\
    \    if plan['refresh']:\n        # Soft refresh is limited to the currently observed\
    \ exact peer/session.\n        # No reset, disable, reconnect, all-peer operation\
    \ or business replay.\n        router.request('/routing/bgp/session/refresh',\
    \ 'POST', {'numbers': identity(plan['refresh']), 'address-family': 'ip'})\n  \
    \      _refresh_pending = False\n    return len(plan['actions'])\n"
  reconcile.py: "#!/usr/bin/env python3\n\"\"\"Reconcile explicitly owned public RouterOS\
    \ forwards before the fallback rule.\"\"\"\nimport base64\nimport ipaddress\n\
    import json\nfrom pathlib import Path\nimport time\nimport urllib.request\nfrom\
    \ pod_return_policy import plan_pod_return, apply_pod_return\n\n\ndef validate(spec):\n\
    \    if spec[\"managementIp\"] != \"192.168.88.1\":\n        raise ValueError(\"\
    RouterOS management authority differs\")\n    if spec[\"publicEndpoint\"] != \"\
    223.159.210.222\":\n        raise ValueError(\"public endpoint authority differs\"\
    )\n    if spec[\"gatewayVip\"] != \"10.251.0.4\":\n        raise ValueError(\"\
    Gateway VIP authority differs\")\n    if spec[\"anchorComment\"] != \"RE8CH default\
    \ WAN TCP same-port DNAT to R640\":\n        raise ValueError(\"fallback anchor\
    \ differs\")\n    if spec[\"returnAnchorComment\"] != \"defconf: masquerade after\
    \ symmetric rules\":\n        raise ValueError(\"return anchor differs\")\n  \
    \  if spec[\"commentPrefix\"] != \"RE8CH GITOPS PUBLIC FORWARD\":\n        raise\
    \ ValueError(\"ownership prefix differs\")\n    if spec[\"outerSniBackend\"] !=\
    \ \"192.168.88.251\" or spec[\"outerSniPort\"] != \"10443\":\n        raise ValueError(\"\
    outer SNI authority differs\")\n    if spec[\"outerSniRules\"] != [\n        \"\
    RE8CH priority public web direct to Cilium Loudi Gateway VIP\",\n        \"RE8CH\
    \ public web LAN VPN hairpin to Cilium Loudi VIP\",\n    ]:\n        raise ValueError(\"\
    outer SNI rule ownership differs\")\n    if spec[\"forwards\"] != [{\"protocol\"\
    : \"tcp\", \"port\": \"6443\", \"toPort\": \"6443\"}]:\n        raise ValueError(\"\
    unexpected public forwards\")\n    ipaddress.ip_address(spec[\"managementIp\"\
    ])\n    ipaddress.ip_address(spec[\"publicEndpoint\"])\n    ipaddress.ip_address(spec[\"\
    gatewayVip\"])\n    ipaddress.ip_address(spec[\"outerSniBackend\"])\n\n\nclass\
    \ Router:\n    def __init__(self, address):\n        user = Path(\"/credential/username\"\
    ).read_bytes().strip()\n        password = Path(\"/credential/password\").read_bytes()\n\
    \        auth = base64.b64encode(user + b\":\" + password).decode()\n        self.base\
    \ = \"http://\" + address + \"/rest\"\n        self.headers = {\"Authorization\"\
    : \"Basic \" + auth, \"Content-Type\": \"application/json\"}\n        self.opener\
    \ = urllib.request.build_opener(urllib.request.ProxyHandler({}))\n\n    def request(self,\
    \ path, method=\"GET\", body=None):\n        request = urllib.request.Request(\n\
    \            self.base + path,\n            method=method,\n            headers=self.headers,\n\
    \            data=json.dumps(body).encode() if body is not None else None,\n \
    \       )\n        with self.opener.open(request, timeout=10) as response:\n \
    \           raw = response.read()\n        return json.loads(raw) if raw else\
    \ {}\n\n\ndef reconcile(router, spec):\n    validate(spec)\n    pod_return_plan\
    \ = plan_pod_return(router, spec.get(\"podReturnPolicy\"))\n    rows = router.request(\"\
    /ip/firewall/nat\")\n    anchors = [row for row in rows if row.get(\"comment\"\
    ) == spec[\"anchorComment\"]]\n    if len(anchors) != 1:\n        raise ValueError(\"\
    fallback anchor missing or ambiguous\")\n    anchor = anchors[0]\n    return_anchors\
    \ = [row for row in rows if row.get(\"comment\") == spec[\"returnAnchorComment\"\
    ]]\n    if len(return_anchors) != 1:\n        raise ValueError(\"return anchor\
    \ missing or ambiguous\")\n    return_anchor = return_anchors[0]\n    wanted =\
    \ set()\n    changes = 0\n    for comment in spec[\"outerSniRules\"]:\n      \
    \  prior = [row for row in rows if row.get(\"comment\") == comment]\n        if\
    \ len(prior) != 1:\n            raise ValueError(\"outer SNI rule missing or ambiguous\"\
    )\n        row = prior[0]\n        expected = {\n            \"chain\": \"dstnat\"\
    ,\n            \"protocol\": \"tcp\",\n            \"dst-port\": \"80,443\",\n\
    \            \"dst-address\": spec[\"publicEndpoint\"],\n            \"action\"\
    : \"dst-nat\",\n            \"to-addresses\": spec[\"outerSniBackend\"],\n   \
    \         \"to-ports\": spec[\"outerSniPort\"],\n        }\n        if any(row.get(key)\
    \ != value for key, value in expected.items()):\n            router.request(\"\
    /ip/firewall/nat/\" + row[\".id\"], \"PATCH\", expected)\n            changes\
    \ += 1\n    for forward in spec[\"forwards\"]:\n        comment = f'{spec[\"commentPrefix\"\
    ]} {forward[\"protocol\"]} {forward[\"port\"]}'\n        wanted.add(comment)\n\
    \        body = {\n            \"comment\": comment,\n            \"chain\": \"\
    dstnat\",\n            \"protocol\": forward[\"protocol\"],\n            \"dst-port\"\
    : forward[\"port\"],\n            \"dst-address\": spec[\"publicEndpoint\"],\n\
    \            \"action\": \"dst-nat\",\n            \"to-addresses\": spec[\"gatewayVip\"\
    ],\n            \"to-ports\": forward[\"toPort\"],\n            \"disabled\":\
    \ \"false\",\n        }\n        prior = [row for row in rows if row.get(\"comment\"\
    ) == comment]\n        if len(prior) > 1:\n            raise ValueError(\"duplicate\
    \ owned public forward\")\n        if prior:\n            row = prior[0]\n   \
    \         if any(row.get(key) != value for key, value in body.items()):\n    \
    \            router.request(\"/ip/firewall/nat/\" + row[\".id\"], \"PATCH\", body)\n\
    \                changes += 1\n        else:\n            row = router.request(\"\
    /ip/firewall/nat\", \"PUT\", body)\n            changes += 1\n        router.request(\n\
    \            \"/ip/firewall/nat/move\",\n            \"POST\",\n            {\"\
    numbers\": row[\".id\"], \"destination\": anchor[\".id\"]},\n        )\n     \
    \   return_comment = f'{spec[\"commentPrefix\"]} RETURN {forward[\"protocol\"\
    ]} {forward[\"port\"]}'\n        wanted.add(return_comment)\n        return_body\
    \ = {\n            \"comment\": return_comment,\n            \"chain\": \"srcnat\"\
    ,\n            \"protocol\": forward[\"protocol\"],\n            \"dst-port\"\
    : forward[\"toPort\"],\n            \"dst-address\": spec[\"gatewayVip\"],\n \
    \           \"action\": \"masquerade\",\n            \"disabled\": \"false\",\n\
    \        }\n        return_prior = [row for row in rows if row.get(\"comment\"\
    ) == return_comment]\n        if len(return_prior) > 1:\n            raise ValueError(\"\
    duplicate owned public return rule\")\n        if return_prior:\n            return_row\
    \ = return_prior[0]\n            if any(return_row.get(key) != value for key,\
    \ value in return_body.items()):\n                router.request(\"/ip/firewall/nat/\"\
    \ + return_row[\".id\"], \"PATCH\", return_body)\n                changes += 1\n\
    \        else:\n            return_row = router.request(\"/ip/firewall/nat\",\
    \ \"PUT\", return_body)\n            changes += 1\n        router.request(\n \
    \           \"/ip/firewall/nat/move\",\n            \"POST\",\n            {\"\
    numbers\": return_row[\".id\"], \"destination\": return_anchor[\".id\"]},\n  \
    \      )\n    for row in rows:\n        comment = row.get(\"comment\", \"\")\n\
    \        if comment.startswith(spec[\"commentPrefix\"] + \" \") and comment not\
    \ in wanted:\n            router.request(\"/ip/firewall/nat/\" + row[\".id\"],\
    \ \"DELETE\")\n            changes += 1\n    pod_return_changes = apply_pod_return(router,\
    \ pod_return_plan)\n    if pod_return_changes and plan_pod_return(router, spec.get(\"\
    podReturnPolicy\"))[\"actions\"]:\n        raise ValueError(\"Pod-return policy\
    \ readback differs\")\n    return {\"changes\": changes, \"forwards\": len(spec[\"\
    forwards\"]),\n            \"podReturnChanges\": pod_return_changes}\n\n\ndef\
    \ main():\n    while True:\n        try:\n            spec = json.loads(Path(\"\
    /config/desired.json\").read_text())\n            result = reconcile(Router(spec[\"\
    managementIp\"]), spec)\n            Path(\"/tmp/routeros-public-forward-ready\"\
    ).touch()\n            print(json.dumps({\"state\": \"reconciled\", **result}),\
    \ flush=True)\n        except Exception as exc:\n            Path(\"/tmp/routeros-public-forward-ready\"\
    ).unlink(missing_ok=True)\n            print(json.dumps({\"state\": \"failed\"\
    , \"errorType\": type(exc).__name__}), flush=True)\n        time.sleep(30)\n\n\
    \nif __name__ == \"__main__\":\n    main()\n"
