apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codex-app-server-console-public
  namespace: codex-platform
spec:
  hostnames:
  - api-shanghai217.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-sh217-https
  rules:
  - backendRefs:
    - name: codex-app-server-console
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /codex-console
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codex-session-web-public
  namespace: codex-platform
spec:
  hostnames:
  - api-shanghai217.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-sh217-https
  rules:
  - backendRefs:
    - name: codex-session-web
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /codex
  - backendRefs:
    - name: codex-session-web
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /api
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-zone-codex-codex-session-web-advfab
  namespace: codex-platform
spec:
  hostnames:
  - codex.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: codex-session-web
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /ui
