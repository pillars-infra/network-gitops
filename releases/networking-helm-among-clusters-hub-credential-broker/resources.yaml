apiVersion: apps/v1
kind: Deployment
metadata:
  name: among-clusters-credential-broker
  namespace: credential-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: among-clusters-credential-broker
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /broker
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HUB_ENDPOINT
          value: http://among-clusters-hub.among-clusters.svc
        - name: CREDENTIAL_NAMESPACE
          value: credential-broker
        - name: SENTRY_DSN
          value: https://2b6b17d602c68bbb6789de55c05afa1a@o4509349085577216.ingest.us.sentry.io/4509349088985088
        - name: SENTRY_RELEASE
          value: among-clusters@9f57051793c9f5218d1cd0827fa705d54d0bccfd
        - name: SENTRY_ENVIRONMENT
          value: production
        image: ghcr.io/among-clusters/among-clusters@sha256:e4318df4f9f6cc47c391c20f178c4b8000627c69c09cc48364630c4a68853d45
        name: broker
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: among-clusters-credential-broker
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: among-clusters-credential-broker
  name: among-clusters-credential-broker
  namespace: credential-broker
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: metrics
    port: 9090
    targetPort: metrics
  selector:
    app.kubernetes.io/name: among-clusters-credential-broker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: among-clusters-credential-broker
  namespace: credential-broker
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: among-clusters-hub
  namespace: credential-broker
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: among-clusters
  to:
  - group: ''
    kind: Service
    name: among-clusters-credential-broker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-credential-broker
  namespace: credential-broker
spec:
  egress:
  - ports:
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector: {}
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: headlamp
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-system
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: re8ch
          app.kubernetes.io/name: vmagent
    ports:
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
  policyTypes:
  - Ingress
  - Egress
