apiVersion: apps/v1
kind: Deployment
metadata:
  name: among-clusters-credential-broker
  namespace: credential-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: among-clusters-credential-broker
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /broker
        env:
        - name: HUB_ENDPOINT
          value: http://among-clusters-hub.among-clusters.svc
        - name: CREDENTIAL_NAMESPACE
          value: credential-broker
        image: ghcr.io/among-clusters/among-clusters@sha256:a80367067b256d0c2989485a0926a9a669affed89f224b6f0adb4cf18bf9be05
        name: broker
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: among-clusters-credential-broker
---
apiVersion: v1
kind: Service
metadata:
  name: among-clusters-credential-broker
  namespace: credential-broker
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: among-clusters-credential-broker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: among-clusters-credential-broker
  namespace: credential-broker
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: among-clusters-hub
  namespace: credential-broker
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: among-clusters
  to:
  - group: ''
    kind: Service
    name: among-clusters-credential-broker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-credential-broker
  namespace: credential-broker
spec:
  egress:
  - ports:
    - port: 80
      protocol: TCP
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: headlamp
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
  policyTypes:
  - Ingress
  - Egress
