apiVersion: v1
data:
  cn.yaml: "mixed-port: 17891\nexternal-controller: 0.0.0.0:19090\nallow-lan: true\n\
    mode: rule\nrule-providers:\n  cn-ip: {type: file, behavior: classical, path:\
    \ /etc/mihomo/rules/cn-ip-rules.yaml}\nproxies:\n  - {name: OVERSEAS-LA, type:\
    \ socks5, server: mihomos-global-exit-overseas-la.egress-fabric.svc.cluster.local,\
    \ port: 1080}\n  - {name: OVERSEAS-LA-2, type: socks5, server: mihomos-global-exit-atlantic.egress-fabric.svc.cluster.local,\
    \ port: 1080}\n  - {name: OVERSEAS-FLK, type: socks5, server: mihomos-global-exit-overseas-flk.egress-fabric.svc.cluster.local,\
    \ port: 1080}\nproxy-groups:\n  - name: GLOBAL\n    type: fallback\n    proxies:\
    \ [OVERSEAS-LA, OVERSEAS-LA-2, OVERSEAS-FLK]\n    url: \"https://www.gstatic.com/generate_204\"\
    \n    interval: 600\n    lazy: true\nrules: [\"IP-CIDR,10.0.0.0/8,DIRECT,no-resolve\"\
    , \"IP-CIDR,100.64.0.0/10,DIRECT,no-resolve\", \"IP-CIDR,172.16.0.0/12,DIRECT,no-resolve\"\
    , \"IP-CIDR,192.168.0.0/16,DIRECT,no-resolve\", \"DOMAIN,ipinfo.io,DIRECT\", \"\
    DOMAIN-SUFFIX,ipinfo.io,DIRECT\", \"DOMAIN-SUFFIX,ghcr.io,GLOBAL\", \"DOMAIN-SUFFIX,pkg-containers.githubusercontent.com,GLOBAL\"\
    , \"DOMAIN-SUFFIX,github.com,GLOBAL\", \"DOMAIN-SUFFIX,githubusercontent.com,GLOBAL\"\
    , \"DOMAIN-SUFFIX,cn,DIRECT\", \"RULE-SET,cn-ip,DIRECT\", \"MATCH,GLOBAL\"]\n"
  exit.yaml: 'mixed-port: 1080

    external-controller: 127.0.0.1:19091

    allow-lan: true

    bind-address: "0.0.0.0"

    mode: direct

    rules: ["MATCH,DIRECT"]

    '
  global.yaml: "mixed-port: 17891\nexternal-controller: 0.0.0.0:19090\nallow-lan:\
    \ true\nmode: rule\nipv6: false\ndns:\n  enable: true\n  ipv6: false\n  enhanced-mode:\
    \ redir-host\n  default-nameserver: [1.1.1.1, 8.8.8.8]\n  nameserver:\n    - https://1.1.1.1/dns-query#DIRECT\n\
    \    - https://dns.google/dns-query#DIRECT\n  nameserver-policy:\n    \"+.cn\"\
    : [https://dns.alidns.com/dns-query#DIRECT, https://doh.pub/dns-query#DIRECT]\n\
    rule-providers:\n  cn-ip: {type: file, behavior: classical, path: /etc/mihomo/rules/cn-ip-rules.yaml}\n\
    proxies:\n  - {name: CN-FABRIC, type: socks5, server: mihomos-cn-exit.egress-fabric.svc.cluster.local,\
    \ port: 1080}\nproxy-groups:\n  - name: CN\n    type: fallback\n    proxies: [CN-FABRIC]\n\
    \    url: \"https://connect.rom.miui.com/generate_204\"\n    interval: 600\n \
    \   lazy: true\nrules: [\"IP-CIDR,10.0.0.0/8,DIRECT,no-resolve\", \"IP-CIDR,100.64.0.0/10,DIRECT,no-resolve\"\
    , \"IP-CIDR,172.16.0.0/12,DIRECT,no-resolve\", \"IP-CIDR,192.168.0.0/16,DIRECT,no-resolve\"\
    , \"DOMAIN,ipinfo.io,DIRECT\", \"DOMAIN-SUFFIX,ipinfo.io,DIRECT\", \"DOMAIN-SUFFIX,cn,CN\"\
    , \"RULE-SET,cn-ip,CN\", \"MATCH,DIRECT\"]\n"
kind: ConfigMap
metadata:
  name: mihomos-node-configs
  namespace: egress-fabric
---
apiVersion: v1
kind: Service
metadata:
  name: mihomos-global-exit-atlantic
  namespace: egress-fabric
spec:
  externalName: among-clusters-gateway.among-clusters.svc.cluster.local
  ports:
  - name: socks
    port: 1080
    targetPort: 1080
  type: ExternalName
