apiVersion: apps/v1
kind: Deployment
metadata:
  name: among-clusters-hub
  namespace: among-clusters
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: among-clusters-hub
    spec:
      containers:
      - command:
        - /hub
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: among-clusters-hub-admin
        - name: MANAGED_ACCESS_ENABLED
          value: 'true'
        - name: RECONCILE_INTERVAL
          value: 60s
        - name: SENTRY_DSN
          value: https://2b6b17d602c68bbb6789de55c05afa1a@o4509349085577216.ingest.us.sentry.io/4509349088985088
        - name: SENTRY_RELEASE
          value: among-clusters@9f57051793c9f5218d1cd0827fa705d54d0bccfd
        - name: SENTRY_ENVIRONMENT
          value: production
        image: ghcr.io/among-clusters/among-clusters@sha256:e4318df4f9f6cc47c391c20f178c4b8000627c69c09cc48364630c4a68853d45
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        name: hub
        ports:
        - containerPort: 8080
          hostPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        kubernetes.io/os: linux
        scheduling.re8ch.com/service-plane: core
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: among-clusters-hub
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: among-clusters-hub-gateway
  namespace: among-clusters
spec:
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '6443'
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-hub
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/instance: re8ch
        k8s:app.kubernetes.io/name: vmagent
        k8s:io.kubernetes.pod.namespace: observability-system
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: among-clusters-hub
  name: among-clusters-hub
  namespace: among-clusters
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: metrics
    port: 9090
    targetPort: metrics
  selector:
    app.kubernetes.io/name: among-clusters-hub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: among-clusters-hub
  namespace: among-clusters
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/hostname: among-clusters.re8ch.com
    external-dns.alpha.kubernetes.io/ttl: '60'
  labels:
    public.re8ch.com/external-dns: enabled
  name: among-clusters-ingest
  namespace: among-clusters
spec:
  hostnames:
  - among-clusters.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: among-clusters-https
  rules:
  - backendRefs:
    - name: among-clusters-credential-broker
      namespace: credential-broker
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /broker
  - backendRefs:
    - name: among-clusters-hub
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /v1
  - backendRefs:
    - name: among-clusters-hub
      port: 80
    matches:
    - path:
        type: Exact
        value: /healthz
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/hostname: among-clusters.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: '60'
    networking.re8ch.com/dns-authority: public-edge
    networking.re8ch.com/provider: public-edge-manager
    networking.re8ch.com/selected-public-edge: loudi-r640
  labels:
    networking.re8ch.com/dns-authority: public-edge
    public.re8ch.com/external-dns: enabled
  name: among-clusters-ingest
  namespace: among-clusters
spec:
  ingressClassName: external-dns-only
  rules:
  - host: among-clusters.re8ch.com
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-hub
  namespace: among-clusters
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: credential-broker
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability-system
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: re8ch
          app.kubernetes.io/name: vmagent
    ports:
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-hub
  policyTypes:
  - Ingress
  - Egress
