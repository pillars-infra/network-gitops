apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: among-clusters-broker-hub
  namespace: credential-broker
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: among-clusters-hub
        k8s:io.kubernetes.pod.namespace: among-clusters
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: among-clusters-broker-imports
  namespace: credential-broker
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: among-clusters-gateway
        k8s:io.kubernetes.pod.namespace: among-clusters
    toPorts:
    - ports:
      - port: '22240'
        protocol: TCP
      - port: '23768'
        protocol: TCP
      - port: '33768'
        protocol: TCP
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '22240'
        protocol: TCP
      - port: '23768'
        protocol: TCP
      - port: '33768'
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: among-clusters-broker-kube-apiserver
  namespace: credential-broker
spec:
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '6443'
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: among-clusters-broker-tool-access
  namespace: credential-broker
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app: re8ch-cloud-platform
        k8s:io.kubernetes.pod.namespace: ai-operations
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-broker-tool-access
  namespace: credential-broker
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-operations
      podSelector:
        matchLabels:
          app: re8ch-cloud-platform
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-credential-broker
  policyTypes:
  - Ingress
