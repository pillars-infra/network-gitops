apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ledger-accounting-public
  namespace: nuclio
spec:
  hostnames:
  - api.re8ch.com
  - api-shanghai77.re8ch.com
  - api-shanghai217.re8ch.com
  - api-guangzhou24.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-https
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-sh77-https
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-sh217-https
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-gz24-https
  rules:
  - backendRefs:
    - name: ledger-accounting-agent-edge
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /ledger/accounting-agent
---
