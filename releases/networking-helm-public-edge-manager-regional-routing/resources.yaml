apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: public-edge-manager
  namespace: regional-routing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: public-edge-manager
  template:
    metadata:
      annotations:
        checksum/config: 1272401a91cbd2726a4b0e70f9dc3c70f86a1d4399e806bdc5fe3cd6ddc69e08
      labels:
        app.kubernetes.io/name: public-edge-manager
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: networking.re8ch.com/public-edge-authority-ready
                operator: In
                values:
                - 'true'
      containers:
      - env:
        - name: RECORDS_FILE
          value: /etc/public-edge-records/records.json
        - name: RUNTIME_FILE
          value: /etc/public-edge-runtime/runtime.json
        - name: NAMESERVERS_FILE
          value: /etc/public-edge-nameservers/nameservers.json
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_API_FALLBACK_URLS_JSON
          value: '["https://10.250.0.1:6443","https://10.181.22.128:6443"]'
        - name: HTTP_PORT
          value: '18080'
        - name: DNS_PORT
          value: '53'
        - name: PROBE_CONNECT_TIMEOUT_SECONDS
          value: '5'
        - name: PROBE_RESPONSE_TIMEOUT_SECONDS
          value: '12'
        - name: PROBE_INTERVAL_SECONDS
          value: '15'
        - name: PROBE_MAX_WORKERS
          value: '8'
        envFrom:
        - configMapRef:
            name: public-edge-manager
        image: ghcr.io/public-edge/public-edge-manager@sha256:60038439603bc63d20a760e1570b3ee515343e29c647d9c257feca45e021841e
        imagePullPolicy: IfNotPresent
        name: manager
        readinessProbe:
          exec:
            command:
            - test
            - -f
            - /dev/shm/public-edge-dns-ready
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /etc/public-edge-records
          name: records
          readOnly: true
        - mountPath: /etc/public-edge-runtime
          name: runtime
          readOnly: true
        - mountPath: /etc/public-edge-snapshot-public
          name: snapshot-public-key
          readOnly: true
        - mountPath: /etc/public-edge-nameservers
          name: nameservers
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: public-edge-manager
      tolerations:
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      - effect: NoSchedule
        key: node.cilium.io/agent-not-ready
        operator: Exists
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: overseas-edge
      volumes:
      - configMap:
          name: public-edge-manager-records
        name: records
      - configMap:
          name: public-edge-runtime
        name: runtime
      - configMap:
          name: public-edge-route-snapshot-public-key
        name: snapshot-public-key
      - configMap:
          name: public-edge-nameservers
        name: nameservers
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 2
    type: RollingUpdate
---
