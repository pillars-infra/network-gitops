data:
  relay.py: "#!/usr/bin/env python3\n\"\"\"Credential-free public relay to reviewed\
    \ Kubernetes API upstreams.\"\"\"\nimport asyncio\nimport os\n\n\nUPSTREAMS =\
    \ (\n    (os.environ[\"PRIVATE_API_HOST\"], 6443),\n    (\"10.43.0.1\", 443),\n\
    \    (\"10.251.0.4\", 6443),\n)\nMAX_CONNECTIONS = 64\nFIRST_BYTE_TIMEOUT = 5\n\
    IDLE_TIMEOUT = 30\nactive_connections = 0\n\n\nasync def pump(reader, writer):\n\
    \    try:\n        while data := await asyncio.wait_for(reader.read(65536), IDLE_TIMEOUT):\n\
    \            writer.write(data)\n            await writer.drain()\n    except\
    \ TimeoutError:\n        pass\n    finally:\n        writer.close()\n\n\nasync\
    \ def handle(client_reader, client_writer):\n    global active_connections\n \
    \   if active_connections >= MAX_CONNECTIONS:\n        client_writer.close()\n\
    \        return\n    active_connections += 1\n    upstream = None\n    try:\n\
    \        try:\n            first = await asyncio.wait_for(\n                client_reader.read(65536),\
    \ FIRST_BYTE_TIMEOUT\n            )\n        except TimeoutError:\n          \
    \  return\n        if not first:\n            return\n        for host, port in\
    \ UPSTREAMS:\n            try:\n                upstream = await asyncio.wait_for(\n\
    \                    asyncio.open_connection(host, port), timeout=3\n        \
    \        )\n                break\n            except (OSError, TimeoutError):\n\
    \                continue\n        if upstream is None:\n            return\n\
    \        gateway_reader, gateway_writer = upstream\n        gateway_writer.write(first)\n\
    \        await gateway_writer.drain()\n        pumps = {\n            asyncio.create_task(pump(client_reader,\
    \ gateway_writer)),\n            asyncio.create_task(pump(gateway_reader, client_writer)),\n\
    \        }\n        _, pending = await asyncio.wait(pumps, return_when=asyncio.FIRST_COMPLETED)\n\
    \        for task in pending:\n            task.cancel()\n        await asyncio.gather(*pumps,\
    \ return_exceptions=True)\n    finally:\n        active_connections -= 1\n   \
    \     client_writer.close()\n        if upstream is not None:\n            upstream[1].close()\n\
    \n\nasync def main():\n    server = await asyncio.start_server(handle, \"0.0.0.0\"\
    , 6443, backlog=64)\n    async with server:\n        await server.serve_forever()\n\
    \nif __name__ == \"__main__\":\n    asyncio.run(main())\n"
