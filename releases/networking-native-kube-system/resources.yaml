  time\nimport urllib.request\n\n\ndef dns(ip, tcp, source):\n    ident = 12753\n    question
  = b''''.join(bytes([len(p)]) + p.encode() for p in ''kubernetes.default.svc.cluster.local''.split(''.''))
  + b''\\0\\0\\1\\0\\1''\n    request = struct.pack(''!HHHHHH'', ident, 256, 1, 0,
  0, 0) + question\n    with socket.socket(socket.AF_INET, socket.SOCK_STREAM if tcp
  else socket.SOCK_DGRAM) as s:\n        s.settimeout(2)\n        s.bind((source,
  0))\n        s.connect((ip, 53))\n        s.sendall(struct.pack(''!H'', len(request))
  + request if tcp else request)\n        if tcp:\n            def recv(n):\n                data
  = b''''\n                while len(data) < n:\n                    part = s.recv(n-len(data))\n                    if
  not part:\n                        raise RuntimeError(''short DNS response'')\n                    data
  += part\n                return data\n            answer = recv(struct.unpack(''!H'',
  recv(2))[0])\n        else:\n            answer = s.recv(4096)\n    if len(answer)
  < 12 or struct.unpack(''!H'', answer[:2])[0] != ident or not answer[2] & 128 or
  answer[3] & 15:\n        raise RuntimeError(''DNS failed'')\n\n\ndef tcp(target):\n    with
  socket.create_connection((target[''ip''], target[''port'']), timeout=3):\n        pass\n\n\ndef
  main():\n    p = json.loads(Path(''/var/lib/re8ch/host-network/desired.json'').read_text())\n    h
  = p[''health'']\n    discovery = json.loads(Path(''/var/lib/re8ch/host-network/health-targets.json'').read_text())\n    if
  time.time() - discovery[''observedAt''] > 120:\n        raise RuntimeError(''stale
  DNS discovery'')\n    h[''dnsReplicas''] = discovery[''dnsReplicas'']\n    if len(h[''dnsReplicas''])
  < 4 or not h[''tcpTargets'']:\n        raise RuntimeError(''incomplete health target
  set'')\n    with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:\n        jobs
  = [pool.submit(dns, ip, protocol, h[''sourceIdentity'']) for ip in h[''dnsReplicas'']
  for protocol in (False, True)]\n        jobs += [pool.submit(tcp, target) for target
