  | sort_by(.sequenceNumber);\n    [.zebra[\"ROS-R640-SERVICE-OUT\"].entries, .bgpd[\"ROS-R640-SERVICE-OUT\"].entries]
  |\n    all(.[]; type == \"array\" and rules == $expected)\n  '' >/dev/null\n}\n\napply_routeros_boundary_batch()
