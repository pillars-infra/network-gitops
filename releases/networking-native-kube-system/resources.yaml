apiVersion: v1
data:
  probe.py: "\"\"\"Measure real DNS reachability from each control node to every DNS\
    \ EndpointSlice IP.\"\"\"\n\nimport concurrent.futures\nimport http.server\nimport\
    \ json\nimport os\nimport random\nimport socket\nimport ssl\nimport struct\nimport\
    \ threading\nimport time\nimport urllib.parse\nimport urllib.request\n\nNODE =\
    \ os.environ[\"NODE_NAME\"]\nAPI = \"https://%s:%s\" % (os.environ[\"KUBERNETES_SERVICE_HOST\"\
    ], os.environ[\"KUBERNETES_SERVICE_PORT\"])\nTOKEN = open(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
    , encoding=\"utf-8\").read().strip()\nCA = \"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\
    \nNAME = \"kubernetes.default.svc.cluster.local\"\nQUESTION = b\"\".join(bytes([len(part)])\
    \ + part.encode() for part in NAME.split(\".\")) + b\"\\x00\\x00\\x01\\x00\\x01\"\
    \nmetrics = []\nlock = threading.Lock()\n\n\ndef endpoints():\n    selector =\
    \ urllib.parse.quote(\"kubernetes.io/service-name=advanced-fabric-dns\")\n   \
    \ url = API + \"/apis/discovery.k8s.io/v1/namespaces/kube-system/endpointslices?labelSelector=\"\
    \ + selector\n    request = urllib.request.Request(url, headers={\"Authorization\"\
    : \"Bearer \" + TOKEN})\n    with urllib.request.urlopen(request, context=ssl.create_default_context(cafile=CA),\
    \ timeout=3) as response:\n        items = json.load(response)[\"items\"]\n  \
    \  return [(ip, endpoint.get(\"nodeName\", \"unknown\"), endpoint.get(\"conditions\"\
    , {}).get(\"ready\") is True)\n            for item in items for endpoint in item.get(\"\
    endpoints\", []) for ip in endpoint.get(\"addresses\", [])]\n\n\ndef query(ip,\
    \ protocol):\n    transaction = random.randrange(65536)\n    packet = struct.pack(\"\
    !HHHHHH\", transaction, 0x0100, 1, 0, 0, 0) + QUESTION\n    kind = socket.SOCK_DGRAM\
    \ if protocol == \"udp\" else socket.SOCK_STREAM\n    with socket.socket(socket.AF_INET,\
    \ kind) as connection:\n        connection.settimeout(2)\n        connection.connect((ip,\
    \ 53))\n        source = connection.getsockname()[0]\n        if protocol == \"\
    udp\":\n            connection.send(packet)\n            response = connection.recv(4096)\n\
    \        else:\n            connection.sendall(struct.pack(\"!H\", len(packet))\
    \ + packet)\n            length = connection.recv(2)\n            if len(length)\
    \ != 2:\n                return 0, source\n            remaining = struct.unpack(\"\
    !H\", length)[0]\n            response = b\"\"\n            while len(response)\
    \ < remaining:\n                chunk = connection.recv(remaining - len(response))\n\
    \                if not chunk:\n                    return 0, source\n       \
    \         response += chunk\n    good = (len(response) >= 12 and struct.unpack(\"\
    !H\", response[:2])[0] == transaction\n            and response[2] & 0x80 and\
    \ response[3] & 0x0f == 0)\n    return int(bool(good)), source\n\n\ndef sample(target):\n\
    \    ip, node, ready = target\n    result = []\n    for protocol in (\"udp\",\
    \ \"tcp\"):\n        try:\n            success, source = query(ip, protocol)\n\
    \        except (OSError, ValueError):\n            success, source = 0, \"unknown\"\
    \n        result.append((ip, node, ready, protocol, success, source))\n    return\
    \ result\n\n\ndef loop():\n    global metrics\n    while True:\n        now =\
    \ int(time.time())\n        try:\n            targets = endpoints()\n        \
    \    with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:\n    \
    \            rows = [row for group in pool.map(sample, targets) for row in group]\n\
    \            lines = ['re8ch_dns_probe_discovery_up{source_node=\"%s\"} 1' % NODE]\n\
    \            for ip, node, ready, protocol, success, source in rows:\n       \
    \         labels = ('source_node=\"%s\",target_node=\"%s\",target_ip=\"%s\",endpoint_ready=\"\
    %s\",'\n                          'protocol=\"%s\",source_ip=\"%s\"') % (NODE,\
    \ node, ip, str(ready).lower(), protocol, source)\n                lines.append(\"\
    re8ch_dns_peer_query_success{%s} %d\" % (labels, success))\n            lines.append('re8ch_dns_probe_last_run_seconds{source_node=\"\
    %s\"} %d' % (NODE, now))\n        except (OSError, ValueError, KeyError, TimeoutError)\
    \ as exc:\n            print(\"DNS endpoint discovery failed: %s\" % exc, flush=True)\n\
    \            lines = ['re8ch_dns_probe_discovery_up{source_node=\"%s\"} 0' % NODE]\n\
    \        with lock:\n            metrics = lines\n        time.sleep(15)\n\n\n\
    class Handler(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n  \
    \      if self.path != \"/metrics\":\n            self.send_error(404)\n     \
    \       return\n        with lock:\n            body = (\"\\n\".join(metrics)\
    \ + \"\\n\").encode()\n        self.send_response(200)\n        self.send_header(\"\
    Content-Type\", \"text/plain; version=0.0.4\")\n        self.send_header(\"Content-Length\"\
    , str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\
    \n    def log_message(self, *_args):\n        pass\n\n\nthreading.Thread(target=loop,\
    \ daemon=True).start()\nhttp.server.ThreadingHTTPServer((\"0.0.0.0\", 9838), Handler).serve_forever()\n"
