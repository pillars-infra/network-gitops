apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: control-api-source
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api-source
  template:
    metadata:
      annotations:
        networking.re8ch.com/config-revision: control-api-cross-fabric-v4
      labels:
        app.kubernetes.io/name: control-api-source
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - overseas-kl
                - overseas-la
                - suxunji
                - muaya-lightweight
                - muaya-ecs
                - zan
                - domain-ex
      containers:
      - command:
        - /usr/bin/sh
        - /config/reconcile.sh
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
        imagePullPolicy: IfNotPresent
        name: reconciler
        readinessProbe:
          exec:
            command:
            - /usr/bin/test
            - -f
            - /run/control-api-source-ready
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /host
          name: host-root
          readOnly: true
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              items:
              - key: reconcile.sh
                path: reconcile.sh
              name: control-api-source
          - configMap:
              items:
              - key: inventory.json
                path: inventory.json
              name: podcidr-fabric-inventory
      - hostPath:
          path: /
          type: Directory
        name: host-root
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 2
    type: RollingUpdate
---
