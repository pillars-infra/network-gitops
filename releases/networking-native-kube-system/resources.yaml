apiVersion: v1
data:
  adoption.json: ENC[AES256_GCM,data:,iv:C31Tyk5zZBPqRbo82tAt6W4CJLmJMCJJWvWERDrnWVY=,tag:/EMAFqrQlBPp5jss2RaMIg==,type:str]
  agent.py: ENC[AES256_GCM,data:,iv:qhtFkvRsUlT/Hi69hQaQe6Mav1Qs4wnT0NldhHCxSnU=,tag:zkTgv7j7mNDDhWySru9B7w==,type:str]
  control_pod_mesh.py: ENC[AES256_GCM,data:,iv:vF+xcZ0pzOazLhMNp48Mc5XD2QNrea1rELcb978Gi68=,tag:l3/NMGKeiAulOJUwTjLhxw==,type:str]
  deliver.sh: "#!/bin/sh\nset -eu\nhost() { nsenter -t 1 -n chroot /host \"$@\"; }\n\
    root=/host/var/lib/re8ch/host-network\nlib=/host/usr/local/lib/re8ch-host-network\n\
    mkdir -p \"$root\" \"$lib/checks\"\nchmod 700 \"$root\" \"$lib\" \"$lib/checks\"\
    \ncp /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \"$root/kube-ca.crt\"\
    \nhost test -x /usr/bin/curl\n# This single-node pilot cannot cause concurrent\
    \ fleet mutations.\njq -e --arg node \"$NODE_NAME\" '.node == $node' /config/package.json\
    \ >/dev/null\n# Install recovery before enabling any forward reconciliation.\n\
    for file in agent.py; do\n  cp \"/config/$file\" \"$lib/$file.next\"\n  chmod\
    \ 700 \"$lib/$file.next\"\n  mv \"$lib/$file.next\" \"$lib/$file\"\ndone\ncp /config/health.py\
    \ \"$lib/checks/fabric.next\"\nchmod 700 \"$lib/checks/fabric.next\"\nmv \"$lib/checks/fabric.next\"\
    \ \"$lib/checks/fabric\"\nfor file in /config/*.service /config/*.timer; do\n\
    \  cp \"$file\" \"/host/etc/systemd/system/$(basename \"$file\")\"\ndone\nhost\
    \ systemctl daemon-reload\nhost systemctl enable --now re8ch-host-network-watchdog.timer\n\
    host systemctl start re8ch-host-network-recover.service\n# Wait for the reconciler\
    \ binary that honors ownership handoff. A config\n# mount alone does not prove\
    \ its already-running shell has loaded the change.\nif [ \"$(jq -r .scope /config/package.json)\"\
    \ = control-transit-peer ]; then\n  # Existing owner keeps routes but yields this\
    \ peer to the transactional agent.\n  host systemctl is-active --quiet re8ch-control-pod-mesh.service\n\
    \  test -f /host/etc/re8ch/control-pod-mesh/control_plane_mesh.py\n  cp /config/control_pod_mesh.py\
    \ /host/etc/re8ch/control-pod-mesh/control_pod_mesh.py.next\n  chmod 644 /host/etc/re8ch/control-pod-mesh/control_pod_mesh.py.next\n\
    \  mv /host/etc/re8ch/control-pod-mesh/control_pod_mesh.py.next /host/etc/re8ch/control-pod-mesh/control_pod_mesh.py\n\
    else\n  while [ ! -f /host/run/re8ch-public-mesh-handoff-v1 ]; do\n    echo 'waiting\
    \ for PodCIDR writer handoff support'\n    sleep 10\n  done\nfi\n# Adoption includes\
    \ exact public-key and FRR-list ownership. No private keys.\ncp /config/adoption.json\
    \ \"$root/adoption.json.next\"\nchmod 600 \"$root/adoption.json.next\"\nmv \"\
    $root/adoption.json.next\" \"$root/adoption.json\"\nwhile true; do\n  cp /config/package.json\
    \ \"$root/desired.json.next\"\n  chmod 600 \"$root/desired.json.next\"\n  mv \"\
    $root/desired.json.next\" \"$root/desired.json\"\n  token=\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\"\
    \n  if host /usr/bin/curl --fail --silent --show-error --max-time 8 \\\n    --cacert\
    \ /var/lib/re8ch/host-network/kube-ca.crt \\\n    -H \"Authorization: Bearer $token\"\
    \ \\\n    \"https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/apis/discovery.k8s.io/v1/namespaces/kube-system/endpointslices?labelSelector=kubernetes.io%2Fservice-name%3Dadvanced-fabric-dns\"\
    \ \\\n    > /tmp/host-network-endpoints.json; then\n    jq --argjson now \"$(date\
    \ +%s)\" '{observedAt:$now,dnsReplicas:([.items[].endpoints[] | select(.conditions.ready\
    \ == true) | .addresses[]] | unique)}' /tmp/host-network-endpoints.json > \"$root/health-targets.json.next\"\
    \n    chmod 600 \"$root/health-targets.json.next\"\n    mv \"$root/health-targets.json.next\"\
    \ \"$root/health-targets.json\"\n  fi\n  unset token\n  host systemctl enable\
    \ --now re8ch-host-network.timer\n  host systemctl show re8ch-host-network.service\
    \ --property=Result --property=ActiveState\n  sleep 30\ndone\n"
  health.py: "#!/usr/bin/env python3\n\"\"\"Bounded fabric gate. Inputs are a GitOps-declared\
    \ health target set.\"\"\"\nimport concurrent.futures\nimport json\nfrom pathlib\
    \ import Path\nimport socket\nimport ssl\nimport struct\nimport time\nimport urllib.request\n\
    \n\ndef dns(ip, tcp, source):\n    ident = 12753\n    question = b''.join(bytes([len(p)])\
    \ + p.encode() for p in 'kubernetes.default.svc.cluster.local'.split('.')) + b'\\\
    0\\0\\1\\0\\1'\n    request = struct.pack('!HHHHHH', ident, 256, 1, 0, 0, 0) +\
    \ question\n    with socket.socket(socket.AF_INET, socket.SOCK_STREAM if tcp else\
    \ socket.SOCK_DGRAM) as s:\n        s.settimeout(2)\n        s.bind((source, 0))\n\
    \        s.connect((ip, 53))\n        s.sendall(struct.pack('!H', len(request))\
    \ + request if tcp else request)\n        if tcp:\n            def recv(n):\n\
    \                data = b''\n                while len(data) < n:\n          \
    \          part = s.recv(n-len(data))\n                    if not part:\n    \
    \                    raise RuntimeError('short DNS response')\n              \
    \      data += part\n                return data\n            answer = recv(struct.unpack('!H',\
    \ recv(2))[0])\n        else:\n            answer = s.recv(4096)\n    if len(answer)\
    \ < 12 or struct.unpack('!H', answer[:2])[0] != ident or not answer[2] & 128 or\
    \ answer[3] & 15:\n        raise RuntimeError('DNS failed')\n\n\ndef tcp(target):\n\
    \    with socket.create_connection((target['ip'], target['port']), timeout=3):\n\
    \        pass\n\n\ndef main():\n    p = json.loads(Path('/var/lib/re8ch/host-network/desired.json').read_text())\n\
    \    h = p['health']\n    discovery = json.loads(Path('/var/lib/re8ch/host-network/health-targets.json').read_text())\n\
    \    if time.time() - discovery['observedAt'] > 120:\n        raise RuntimeError('stale\
    \ DNS discovery')\n    h['dnsReplicas'] = discovery['dnsReplicas']\n    if len(h['dnsReplicas'])\
    \ < 4 or not h['tcpTargets']:\n        raise RuntimeError('incomplete health target\
    \ set')\n    with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:\n\
    \        jobs = [pool.submit(dns, ip, protocol, h['sourceIdentity']) for ip in\
    \ h['dnsReplicas'] for protocol in (False, True)]\n        jobs += [pool.submit(tcp,\
    \ target) for target in h['tcpTargets']]\n        for job in jobs:\n         \
    \   job.result()\n    # External origin/certificate and explicit proxy are declared\
    \ separately.\n    opener = urllib.request.build_opener(urllib.request.ProxyHandler({'https':\
    \ h['egressProxy']}))\n    with opener.open(h['egressURL'], timeout=5) as response:\n\
    \        if response.status not in (200, 204):\n            raise RuntimeError('egress\
    \ failure')\n\n\nif __name__ == '__main__':\n    main()\n"
  package.json: ENC[AES256_GCM,data:,iv:j5w7AWx4nuLmwNA9u9U8Roy2Sasr0oYx9q6akp1PMjg=,tag:g463UP/3MAiih6Sr39DFxw==,type:str]
