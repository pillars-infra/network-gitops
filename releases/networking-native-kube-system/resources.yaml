apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-api-observer-proxy
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-api-observer-proxy
  template:
    metadata:
      annotations:
        networking.re8ch.com/config-revision: observer-proxy-v2
      labels:
        app.kubernetes.io/name: kube-api-observer-proxy
        operations.re8ch.com/credential-contract: node-observer
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python3
        - /config/proxy.py
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - import socket; socket.create_connection(('10.43.0.1', 443), 3).close()
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        name: proxy
        ports:
        - containerPort: 6443
          name: kube-api
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - import socket; socket.create_connection(('10.43.0.1', 443), 3).close()
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: kube-api-observer-proxy
        name: config
---
