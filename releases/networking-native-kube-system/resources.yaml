  public-mesh-podcidr-reconcile.sh: "#!/bin/sh\n# Reconcile only explicitly paired\
    \ public-mesh PodCIDR BGP policies.\nset -eu\n\nhost() { nsenter -t 1 -n chroot\
    \ /host \"$@\"; }\nloaded_revision=\"$(sha256sum /config/public-mesh.json /config/reconcile.sh)\"\
    \nnode=\"$(jq -c --arg name \"$NODE_NAME\" '.nodes[] | select(.name == $name)'\
    \ /config/public-mesh.json)\"\n[ -n \"$node\" ] || exit 2\nown_id=\"$(printf '%s'\
    \ \"$node\" | jq -r .id)\"\nown_asn=\"$(printf '%s' \"$node\" | jq -r .asn)\"\n\
    own_pod=\"$(printf '%s' \"$node\" | jq -r .podCIDR)\"\n[ \"$own_pod\" != null\
    \ ] || exit 2\n\nreconcile_peer() {\n  peer_name=\"$1\"\n  peer=\"$(jq -c --arg\
    \ name \"$peer_name\" '.nodes[] | select(.name == $name)' /config/public-mesh.json)\"\
    \n  [ -n \"$peer\" ] || return 1\n  printf '%s' \"$peer\" | jq -e --arg name \"\
