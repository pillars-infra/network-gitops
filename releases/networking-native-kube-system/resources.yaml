apiVersion: v1
data:
  reconcile.sh: "#!/bin/sh\nset -eu\n\nnft() { nsenter -t 1 -n chroot /host /usr/sbin/nft\
    \ \"$@\"; }\niptables() { nsenter -t 1 -n chroot /host /usr/sbin/iptables \"$@\"\
    ; }\nsysctl() { nsenter -t 1 -n chroot /host /usr/sbin/sysctl \"$@\"; }\n\ninstall_rules()\
    \ {\n  sysctl -w net.ipv4.conf.eno2np1.route_localnet=1 >/dev/null\n  iptables\
    \ -C INPUT -p tcp -d 127.0.0.1 --dport 443 \\\n    -m comment --comment re8ch-outer-sni\
    \ -j ACCEPT 2>/dev/null || \\\n  iptables -I INPUT 1 -p tcp -d 127.0.0.1 --dport\
    \ 443 \\\n    -m comment --comment re8ch-outer-sni -j ACCEPT\n  nft delete table\
    \ ip re8ch_outer_sni 2>/dev/null || true\n  nft add table ip re8ch_outer_sni\n\
    \  nft 'add chain ip re8ch_outer_sni prerouting { type nat hook prerouting priority\
    \ dstnat - 10; policy accept; }'\n  nft add rule ip re8ch_outer_sni prerouting\
    \ \\\n    fib daddr type local tcp dport 10443 dnat to 127.0.0.1:443\n}\n\ncleanup()\
    \ {\n  nft delete table ip re8ch_outer_sni 2>/dev/null || true\n  iptables -D\
    \ INPUT -p tcp -d 127.0.0.1 --dport 443 \\\n    -m comment --comment re8ch-outer-sni\
    \ -j ACCEPT 2>/dev/null || true\n}\ntrap cleanup EXIT INT TERM\n\ninstall_rules\n\
    while sleep 10; do\n  nft list table ip re8ch_outer_sni >/dev/null 2>&1 || install_rules\n\
    done\n"
