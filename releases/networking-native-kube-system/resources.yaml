    \ this one neighbor. Keep all other FRR policy.\n  host vtysh -c 'configure terminal'\
    \ -c \"no ip prefix-list $outbound\" -c \"ip prefix-list $outbound seq 10 permit\
    \ $identity\" -c \"ip prefix-list $outbound seq 20 permit $own_pod\" -c end\n\
    \  if [ -n \"$relay_vip\" ]; then\n    host vtysh -c 'configure terminal' -c \"\
