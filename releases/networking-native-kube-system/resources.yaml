_re8chSopsSource: '{"apiVersion":"v1","data":{"reconcile.sh":"ENC[AES256_GCM,data:,iv:r7f19+JnF2av8kf9SxfRhH8X6LuF1auf/Wz+PWt37YQ=,tag:riJu/GfuPsz9J/WWTGEoQQ==,type:str]","owned-prefixes.sh":"#!/bin/sh\n#
  Existing host reconciler helpers. No Kubernetes writes or new controller.\n# The
  host ledger is committed only after FRR has accepted the desired batch.\nowned_prefix_ledger=${owned_prefix_ledger:-/host/var/lib/re8ch/podcidr-fabric/owned-prefixes.json}\n\nallocation_snapshot_authoritative()
  {\n  jq -e --arg node \"${NODE_NAME}\" ''\n    def ipv4cidr: type == \"string\"
  and test(\"^([0-9]{1,3}\\\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$\");\n    (.items
  | type == \"array\") and\n    ([.items[] | select(.metadata.name == $node and (.metadata.uid
  | type == \"string\" and length > 0) and (.metadata.resourceVersion | type == \"string\"
  and length > 0) and ([.metadata.ownerReferences[]? | select(.apiVersion == \"v1\"
  and .kind == \"Node\" and .name == $node and (.uid | type == \"string\" and length
  > 0))] | length == 1))\n      | .spec.ipam.pools.allocated | select(type == \"array\")]
  | length == 1) and\n    ([.items[] | .spec.ipam.pools.allocated[]? |\n      type
  == \"object\" and (.cidrs | type == \"array\")] | all) and\n    ([.items[] | .spec.ipam.pools.allocated[]?.cidrs[]?
  | ipv4cidr] | all) and\n    ([.items[] | .metadata.name as $n | .spec.ipam.pools.allocated[]?.cidrs[]?
  | {prefix:.,node:$n}]\n      | group_by(.prefix) | all(.[]; ([.[].node] | unique
  | length) == 1))\n  '' \"${cilium_nodes}\" >/dev/null 2>&1\n}\n\nread_owned_prefix_ledger()
  {\n  [ -f \"${owned_prefix_ledger}\" ] || return 0\n  jq -er --arg node \"${NODE_NAME}\"
  ''\n    if .version == 1 and .nodeName == $node and (.sourceUID | type == \"string\"
  and length > 0) and\n       (.sourceResourceVersion | type == \"string\" and length
  > 0) and\n       (.ownerNodeUID | type == \"string\" and length > 0) and (.prefixes
  | type == \"array\") and\n       all(.prefixes[]; type == \"string\" and test(\"^([0-9]{1,3}\\\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$\"))\n    then
  (.prefixes | join(\"\\n\")) else error(\"invalid owned-prefix ledger\") end\n  ''
  \"${owned_prefix_ledger}\"\n}\n\nprepare_owned_prefix_reconciliation() {\n  previous_owned_prefixes=\"$(read_owned_prefix_ledger)\"
  || return 1\n  observed_owner_node_uid=\"$(jq -r --arg node \"${NODE_NAME}\" ''.items[]?
  | select(.metadata.name == $node) |\n    .metadata.ownerReferences[]? | select(.apiVersion
  == \"v1\" and .kind == \"Node\" and .name == $node) | .uid // empty'' \"${cilium_nodes}\")\"\n  if
  [ -f \"${owned_prefix_ledger}\" ] && [ -n \"${observed_owner_node_uid}\" ]; then\n    #
  Recreated CiliumNode objects may change UID normally. The durable host\n    # owner
  is the same Kubernetes Node; migrate the source UID/RV after apply.\n    jq -e --arg
  uid \"${observed_owner_node_uid}\" ''.ownerNodeUID == $uid'' \"${owned_prefix_ledger}\"
  >/dev/null || {\n      echo \"${NODE_NAME}: owned-prefix ledger belongs to a different
  Kubernetes Node UID\" >&2\n      return 1\n    }\n  fi\n  retired_pod_cidrs=\n  if
  ! allocation_snapshot_authoritative; then\n    # Never withdraw after an API outage,
  partial Node object, or conflicting\n    # allocation. Keep the accepted local ownership
  until authority returns.\n    owned_pod_cidrs=\"$(printf ''%s\\n%s\\n'' \"${owned_pod_cidrs}\"
  \"${previous_owned_prefixes}\" | awk ''NF && !seen[$0]++'')\"\n    return 0\n  fi\n  retired_pod_cidrs=\"$(printf
  ''%s\\n'' \"${previous_owned_prefixes}\" | while read -r prefix; do\n    [ -n \"${prefix}\"
  ] || continue\n    printf ''%s\\n'' \"${owned_pod_cidrs}\" | grep -Fxq \"${prefix}\"
  || printf ''%s\\n'' \"${prefix}\"\n  done)\"\n  # Bootstrap only positively reassigned
  prefixes. A known other fabric node\n  # must own the exact allocation, and both
  signatures of this controller''s\n  # old local origination must still exist. Ordinary/static/provider
  routes\n  # and blackholes without a local sourced BGP network are never candidates.\n  transferred=\"$(jq
  -r --arg node \"${NODE_NAME}\" --slurpfile inventory /config/inventory.json ''\n    [$inventory[0]
  | .routeServers[], .nodes[], .relayNodes[]? | .name] as $members |\n    .items[]
  | select(.metadata.name != $node and (.metadata.name as $n | $members | index($n)
  != null)) |\n    .spec.ipam.pools.allocated[]?.cidrs[]?'' \"${cilium_nodes}\" |
  sort -u)\"\n  for prefix in ${transferred}; do\n    printf ''%s\\n'' \"${owned_pod_cidrs}\"
  | grep -Fxq \"${prefix}\" && continue\n    host vtysh -c \"show ip route ${prefix}
  json\" 2>/dev/null |\n      jq -e --arg prefix \"${prefix}\" ''[.[$prefix][]? |
  select(.protocol == \"static\" and .distance == 254)\n        | .nexthops[]? | select(.blackhole
  == true)] | length > 0'' >/dev/null || continue\n    host vtysh -c \"show bgp ipv4
  unicast ${prefix} json\" 2>/dev/null |\n      jq -e ''[.paths[]? | select(.local
  == true and .sourced == true)] | length > 0'' >/dev/null || continue\n    retired_pod_cidrs=\"$(printf
  ''%s\\n%s\\n'' \"${retired_pod_cidrs}\" \"${prefix}\" | awk ''NF && !seen[$0]++'')\"\n  done\n}\n\nretired_prefix_routes()
  {\n  [ -n \"${retired_pod_cidrs}\" ] || return 0\n  configured=\"$(frr_configured_prefixes)\"
  || return 1\n  printf ''%s\\n'' \"${configured}\" | grep -Fxq \"default-asn ${asn}\"
  || return 1\n  for prefix in ${retired_pod_cidrs}; do\n    if printf ''%s\\n'' \"${configured}\"
  | grep -Fxq \"route ${prefix}\"; then\n      printf ''no ip route %s Null0 254\\n''
  \"${prefix}\"\n    fi\n  done\n}\n\nretired_prefix_networks() {\n  [ -n \"${retired_pod_cidrs}\"
  ] || return 0\n  configured=\"$(frr_configured_prefixes)\" || return 1\n  printf
  ''%s\\n'' \"${configured}\" | grep -Fxq \"default-asn ${asn}\" || return 1\n  for
  prefix in ${retired_pod_cidrs}; do\n    if printf ''%s\\n'' \"${configured}\" |
  grep -Fxq \"network ${prefix}\"; then\n      printf ''no network %s\\n'' \"${prefix}\"\n    fi\n  done\n}\n\ncommit_owned_prefix_reconciliation()
  {\n  ledger_directory=\"$(dirname \"${owned_prefix_ledger}\")\"\n  mkdir -p \"${ledger_directory}\"\n  chmod
  700 \"${ledger_directory}\"\n  ledger_candidate=\"$(mktemp \"${ledger_directory}/.owned-prefixes.XXXXXX\")\"\n  chmod
  600 \"${ledger_candidate}\"\n  source_uid=\"$(jq -r --arg node \"${NODE_NAME}\"
  ''.items[]? | select(.metadata.name == $node) | .metadata.uid // empty'' \"${cilium_nodes}\")\"\n  source_rv=\"$(jq
  -r --arg node \"${NODE_NAME}\" ''.items[]? | select(.metadata.name == $node) | .metadata.resourceVersion
  // empty'' \"${cilium_nodes}\")\"\n  source_node_uid=\"$(jq -r --arg node \"${NODE_NAME}\"
  ''.items[]? | select(.metadata.name == $node) |\n    .metadata.ownerReferences[]?
  | select(.apiVersion == \"v1\" and .kind == \"Node\" and .name == $node) | .uid
  // empty'' \"${cilium_nodes}\")\"\n  # Do not overwrite the accepted snapshot''s
  identity during an API outage.\n  if ! allocation_snapshot_authoritative; then\n    rm
  -f \"${ledger_candidate}\"\n    return 0\n  fi\n  printf ''%s\\n'' \"${owned_pod_cidrs}\"
  | jq -Rsc --arg node \"${NODE_NAME}\" --arg uid \"${source_uid}\" --arg rv \"${source_rv}\"
  --arg nodeUID \"${source_node_uid}\" \\\n    ''{version:1,nodeName:$node,sourceUID:$uid,sourceResourceVersion:$rv,ownerNodeUID:$nodeUID,prefixes:(split(\"\\n\")
  | map(select(length > 0)) | unique)}'' >\"${ledger_candidate}\"\n  mv \"${ledger_candidate}\"
  \"${owned_prefix_ledger}\"\n}\n\nfabric_route_server_next_hop_maps() {\n  identity_next_hop=$1\n  transport_next_hop=$2\n  interconnect_next_hop=$3\n  for
  mode in IDENTITY TRANSPORT INTERCONNECT; do\n    case \"${mode}\" in\n      IDENTITY)
  next_hop=\"${identity_next_hop}\" ;;\n      TRANSPORT) next_hop=\"${transport_next_hop}\"
  ;;\n      INTERCONNECT) next_hop=\"${interconnect_next_hop}\" ;;\n    esac\n    #
  Rewrite all admitted fabric prefixes, not just RR-owned prefixes.\n    # Each next
  hop is this RR''s address on the receiving peer''s own link.\n    printf ''route-map
  POD-FABRIC-RR-%s-OUT permit 10\\n'' \"${mode}\"\n    printf ''match ip address prefix-list
  POD-FABRIC-OUT\\nset ip next-hop %s\\nexit\\n'' \"${next_hop}\"\n    printf ''no
  route-map POD-FABRIC-RR-%s-OUT permit 20\\n'' \"${mode}\"\n  done\n}\n\nfabric_peer_next_hop()
  {\n  printf ''no neighbor %s attribute-unchanged next-hop\\n'' \"$1\"\n  printf
  ''neighbor %s next-hop-self force\\n'' \"$1\"\n}\n\nverify_owned_prefix_reconciliation()
  {\n  for prefix in ${owned_pod_cidrs}; do\n    host vtysh -c \"show ip route ${prefix}
  json\" 2>/dev/null |\n      jq -e --arg prefix \"${prefix}\" ''[.[$prefix][]? |
  select(.protocol == \"static\" and .distance == 254)\n        | .nexthops[]? | select(.blackhole
  == true)] | length > 0'' >/dev/null || return 1\n    host vtysh -c \"show bgp ipv4
  unicast ${prefix} json\" 2>/dev/null |\n      jq -e ''[.paths[]? | select(.local
  == true and .sourced == true)] | length > 0'' >/dev/null || return 1\n  done\n  for
  prefix in ${retired_pod_cidrs}; do\n    host vtysh -c \"show ip route ${prefix}
  json\" 2>/dev/null |\n      jq -e --arg prefix \"${prefix}\" ''[.[$prefix][]? |
  select(.protocol == \"static\" and .distance == 254)\n        | .nexthops[]? | select(.blackhole
  == true)] | length == 0'' >/dev/null || return 1\n    host vtysh -c \"show bgp ipv4
  unicast ${prefix} json\" 2>/dev/null |\n      jq -e ''[.paths[]? | select(.local
  == true and .sourced == true)] | length == 0'' >/dev/null || return 1\n  done\n  configured=\"$(frr_configured_prefixes)\"
  || return 1\n  printf ''%s\\n'' \"${configured}\" | grep -Fxq \"default-asn ${asn}\"
  || return 1\n  for prefix in ${owned_pod_cidrs}; do\n    printf ''%s\\n'' \"${configured}\"
  | grep -Fxq \"route ${prefix}\" || return 1\n    printf ''%s\\n'' \"${configured}\"
  | grep -Fxq \"network ${prefix}\" || return 1\n  done\n  for prefix in ${retired_pod_cidrs};
  do\n    if printf ''%s\\n'' \"${configured}\" | grep -Fxq \"route ${prefix}\" ||\n       printf
  ''%s\\n'' \"${configured}\" | grep -Fxq \"network ${prefix}\"; then\n      return
  1\n    fi\n  done\n\n}\n\napply_owned_frr_batch() {\n  frr_batch=\"$(cat)\"\n  #
  vtysh interactive stdin exits zero even after invalid commands. Native -c\n  # accepts
  multiline commands and fails at the first command error. A daemon\n  # can still
  report CMD_WARNING, so independently verify ownership before\n  # committing its
  durable ledger; an exit code alone is not acceptance.\n  if [ -n \"${retired_pod_cidrs}\"
  ]; then\n    configured=\"$(frr_configured_prefixes)\" || return 1\n    printf ''%s\\n''
  \"${configured}\" | grep -Fxq \"default-asn ${asn}\" || return 1\n  fi\n  host vtysh
  -c \"${frr_batch}\" || return 1\n  verify_owned_prefix_reconciliation || {\n    echo
  \"${NODE_NAME}: FRR ownership readback did not match the applied batch\" >&2\n    return
  1\n  }\n  commit_owned_prefix_reconciliation\n}\n\n\nfabric_transit_pod_cidrs()
  {\n  # Only exact observed allocations of declared non-local fabric members.\n  #
  A private transport hop may carry those members'' un-SNATed Pod packets.\n  # Do
  not replace this with an entire pool, a default route, or public peers.\n  jq -r
  --arg node \"${NODE_NAME}\" --slurpfile inventory /config/inventory.json ''\n    [$inventory[0]
  | .routeServers[], .nodes[], .relayNodes[]? | .name | select(. != $node)] as $members
  |\n    .items[]? | select(.metadata.name as $n | $members | index($n) != null) |\n    .spec.ipam.pools.allocated[]?.cidrs[]?''
  \"${cilium_nodes}\" | sort -u\n}\n\nfabric_rr_transit_allowed_ips() {\n  transit_allowed=$1\n  if
  ! allocation_snapshot_authoritative; then\n    printf ''%s\\n'' \"${transit_allowed}\"\n    return
  0\n  fi\n  for transit_prefix in $(fabric_transit_pod_cidrs); do\n    case \",${transit_allowed},\"
  in\n      *\",${transit_prefix},\"*) : ;;\n      *) transit_allowed=\"${transit_allowed:+${transit_allowed},}${transit_prefix}\"
  ;;\n    esac\n  done\n  printf ''%s\\n'' \"${transit_allowed}\"\n}\n\nfabric_spoke_allowed_ips()
  {\n  spoke_target=$1\n  spoke_current=$2\n  spoke_desired=$3\n  spoke_transit_members=${4:-}\n  if
  ! allocation_snapshot_authoritative; then\n    # An incomplete/conflicting snapshot
  must not reassign a cryptokey prefix.\n    printf ''%s\\n'' \"${spoke_current}\"\n    return
  0\n  fi\n  jq -r --arg target \"${spoke_target}\" --arg current \"${spoke_current}\"
  \\\n    --arg desired \"${spoke_desired}\" --arg transit \"${spoke_transit_members}\"
  \\\n    --slurpfile inventory /config/inventory.json ''\n    . as $snapshot |\n    [$inventory[0]
  | .routeServers[], .nodes[], .relayNodes[]? | .name] as $members |\n    ([$target]
  + ($transit | split(\"\\n\") | map(select(length > 0)))) as $accepted |\n    def
  owners($prefix): [$snapshot.items[]? |\n      select(.metadata.name as $n | $members
  | index($n) != null) |\n      select(any(.spec.ipam.pools.allocated[]?.cidrs[]?;
  . == $prefix)) | .metadata.name] | unique;\n    (($current | split(\",\")) + ($desired
  | split(\"\\n\"))) |\n    map(select(length > 0)) |\n    map(select(owners(.) as
  $owners |\n      ($owners | length == 0) or all($owners[]; . as $n | $accepted |
  index($n) != null))) |\n    reduce .[] as $prefix ([]; if index($prefix) == null
  then . + [$prefix] else . end) |\n    join(\",\")\n  '' \"${cilium_nodes}\"\n}\n\nfabric_allocation_snapshot_hash()
  {\n  # Reload on ownership/observation changes as well as CIDR changes. Missing\n  #
  allocation fields are unknown, while an observed empty array is authority.\n  #
  ResourceVersion/status heartbeats intentionally do not restart this actor.\n  jq
  -Sc ''[.items[]? | .metadata.name as $name | {\n    name: $name,\n    sourceUID:
  .metadata.uid,\n    ownerNodeUIDs: ([.metadata.ownerReferences[]? |\n      select(.apiVersion
  == \"v1\" and .kind == \"Node\" and .name == $name) | .uid] | sort),\n    allocated:
  (.spec.ipam.pools.allocated |\n      if type == \"array\" then {type: \"array\",
  entries: (map(\n        if type == \"object\" then {\n          pool: .pool,\n          cidrsType:
  (.cidrs | type),\n          cidrs: (.cidrs | if type == \"array\" then sort else
  . end)\n        } else {entryType: type} end) | sort_by(.pool, .cidrsType, .cidrs))}\n      else
  {type: type} end)\n  }] | sort_by(.name)'' \"${cilium_nodes}\" | sha256sum | awk
  ''{print $1}''\n}\n\nfrr_configured_prefixes() {\n  config_status=\"$(mktemp)\"\n  config_metadata=\"$(mktemp)\"\n  #
  Filter on the node before retaining any output: no neighbour credentials,\n  # full
  configuration, or unrelated command text enters the metadata snapshot.\n  {\n    if
  host vtysh -c ''show running-config''; then\n      printf ''0'' >\"${config_status}\"\n    else\n      printf
  ''1'' >\"${config_status}\"\n    fi\n  } | awk -v own_asn=\"${asn}\" ''\n    $1
  == \"vrf\" { in_vrf = 1; own_bgp = 0; next }\n    $1 == \"exit-vrf\" { in_vrf =
  0; own_bgp = 0; next }\n    !in_vrf && $1 == \"ip\" && $2 == \"route\" && NF ==
  5 && $4 == \"Null0\" && $5 == \"254\" { print \"route \" $3 }\n    $1 == \"router\"
  {\n      own_bgp = (!in_vrf && $2 == \"bgp\" && $3 == own_asn && NF == 3)\n      if
  (!in_vrf && $2 == \"bgp\" && NF == 3) print \"default-asn \" $3\n    }\n    own_bgp
  && $1 == \"network\" && NF == 2 { print \"network \" $2 }\n  '' >\"${config_metadata}\"\n  if
  [ \"$(cat \"${config_status}\")\" != 0 ]; then\n    rm -f \"${config_status}\" \"${config_metadata}\"\n    return
  1\n  fi\n  cat \"${config_metadata}\"\n  rm -f \"${config_status}\" \"${config_metadata}\"\n}\n\n#
  Exact R640 boundary prefix-list, derived from the accepted local ownership\n# computed
  by apply_fabric (current allocations plus the last-known ledger).\n# Do not read
  Node.spec.podCIDR again or invent a second ownership registry.\nrouteros_boundary_owned_prefix_lines()
  {\n  [ \"${NODE_NAME}\" = r640 ] && [ \"${routeros_peer}\" = 192.168.88.1 ] || return
  1\n  [ \"${owned_pod_cidrs+x}\" = x ] || return 1\n  owned_exports=\"$(printf ''%s\\n''
  \"${owned_pod_cidrs}\" | jq -Rsc ''\n    def canonical24:\n      split(\"/\") as
  $cidr | ($cidr[0] | split(\".\")) as $octets |\n      ($cidr | length) == 2 and
  $cidr[1] == \"24\" and\n      ($octets | length) == 4 and\n      all($octets[];
  test(\"^[0-9]+$\") and (tonumber >= 0 and tonumber <= 255) and (tonumber | tostring)
  == .) and\n      $octets[0] == \"10\" and $octets[3] == \"0\" and\n      ($octets[1]
  == \"42\" or ($octets[1] | tonumber >= 64 and tonumber <= 79));\n    split(\"\\n\")
  | map(select(length > 0)) | unique |\n    if all(.[]; canonical24) then . else error(\"invalid
  accepted ownership\") end\n  '')\" || return 1\n  vip_exports=\"$(printf ''%s\\n''
  \"${node}\" | jq -ce ''\n    (.serviceVipExports // []) as $vips |\n    if ($vips
  | type) == \"array\" and all($vips[];\n      type == \"string\" and test(\"^10\\\\.251\\\\.0\\\\.([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])/32$\"))\n    then
  $vips | unique else error(\"invalid declared VIP export\") end\n  '')\" || return
  1\n  # Render only after both inputs validate. Full replacement withdraws retired\n  #
  exports; disjoint sequence ranges preserve all reviewed service VIPs.\n  echo ''no
  ip prefix-list ROS-R640-SERVICE-OUT''\n  printf ''%s\\n'' \"${owned_exports}\" |
  jq -r ''to_entries[] | \"ip prefix-list ROS-R640-SERVICE-OUT seq \\((.key + 1) *
  10) permit \\(.value)\"''\n  printf ''%s\\n'' \"${vip_exports}\" | jq -r ''to_entries[]
  | \"ip prefix-list ROS-R640-SERVICE-OUT seq \\(100000 + (.key + 1) * 10) permit
  \\(.value)\"''\n  echo ''ip prefix-list ROS-R640-SERVICE-OUT seq 200000 deny any''\n}\n\nverify_routeros_boundary_exports()
  {\n  rendered_export_rules=\"$(routeros_boundary_owned_prefix_lines)\" || return
  1\n  desired_export_rules=\"$(printf ''%s\\n'' \"${rendered_export_rules}\" | jq
  -Rsc ''\n    split(\"\\n\") | map(select(startswith(\"ip prefix-list ROS-R640-SERVICE-OUT
  seq \")) | split(\" \") |\n      if .[5] == \"deny\" and .[6] == \"any\" then\n        {sequenceNumber:(.[4]
  | tonumber),type:\"deny\",prefix:\"0.0.0.0/0\",maximumPrefixLength:32}\n      else
