data:
  proxy.py: "#!/usr/bin/env python3\n\"\"\"Credential-free TCP bridge from the public\
    \ Gateway to the internal API.\"\"\"\nimport asyncio\n\n\nUPSTREAM_HOST = \"10.43.0.1\"\
    \nUPSTREAM_PORT = 443\n\n\nasync def pump(reader, writer):\n    try:\n       \
    \ while data := await reader.read(65536):\n            writer.write(data)\n  \
    \          await writer.drain()\n    finally:\n        try:\n            writer.write_eof()\n\
    \            await writer.drain()\n        except (AttributeError, OSError):\n\
    \            writer.close()\n\n\nasync def handle(client_reader, client_writer):\n\
    \    try:\n        upstream_reader, upstream_writer = await asyncio.wait_for(\n\
    \            asyncio.open_connection(UPSTREAM_HOST, UPSTREAM_PORT), timeout=5\n\
    \        )\n    except (OSError, TimeoutError):\n        client_writer.close()\n\
    \        return\n    await asyncio.gather(\n        pump(client_reader, upstream_writer),\n\
    \        pump(upstream_reader, client_writer),\n        return_exceptions=True,\n\
    \    )\n    upstream_writer.close()\n    client_writer.close()\n    await asyncio.gather(\n\
    \        upstream_writer.wait_closed(), client_writer.wait_closed(), return_exceptions=True\n\
    \    )\n\n\nasync def main():\n    server = await asyncio.start_server(handle,\
    \ \"0.0.0.0\", 6443, backlog=64)\n    async with server:\n        await server.serve_forever()\n\
    \n\nasyncio.run(main())\n"
