spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-api-overseas-relay
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-api-overseas-relay
        operations.re8ch.com/credential-contract: node-observer
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python3
        - /config/relay.py
        env:
        - name: PRIVATE_API_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: kube-api-overseas-relay-upstream
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 30
          tcpSocket:
            port: kube-api
          timeoutSeconds: 5
        name: relay
        ports:
        - containerPort: 6443
          hostPort: 6443
          name: kube-api
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 2
          periodSeconds: 10
          tcpSocket:
            port: kube-api
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: overseas-edge
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      volumes:
      - configMap:
          name: kube-api-overseas-relay
        name: config
---
