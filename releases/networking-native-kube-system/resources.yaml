apiVersion: v1
data:
  reconcile.sh: "#!/bin/sh\nset -eu\nnode=\"$(jq -c --arg name \"${NODE_NAME}\" '.nodes[]\
    \ | select(.name == $name and .peerMode == \"transport\")' /config/inventory.json)\"\
    \ntest -n \"${node}\"\nlast=\"$(printf '%s' \"${node}\" | jq -r '.internalIp |\
    \ split(\".\")[3]')\"\nidentity=\"$(printf '%s' \"${node}\" | jq -r '.acceleratedIp')\"\
    \nhost() { nsenter -t 1 -n chroot /host \"$@\"; }\nwhile :; do\n  rm -f /run/control-api-source-ready\n\
    \  host ip -4 addr show | grep -Fq \"${identity}/32\" || { sleep 15; continue;\
    \ }\n  host nft list table ip re8ch_control_api_snat >/dev/null 2>&1 ||\n    host\
    \ nft add table ip re8ch_control_api_snat\n  host nft list chain ip re8ch_control_api_snat\
    \ postrouting >/dev/null 2>&1 ||\n    host nft 'add chain ip re8ch_control_api_snat\
    \ postrouting { type nat hook postrouting priority srcnat; policy accept; }'\n\
    \  active=0\n  for fabric in 93 94; do\n    if [ \"${fabric}\" = 93 ]; then iface=wg-pt-a1;\
    \ else iface=wg-pt-b1; fi\n    host ip link show \"${iface}\" >/dev/null 2>&1\
    \ || continue\n    active=1\n    peer=\"$(host wg show \"${iface}\" peers | awk\
    \ 'NR == 1 {print; exit}')\"\n    if [ -n \"${peer}\" ]; then\n      allowed=\"\
    $(host wg show \"${iface}\" allowed-ips | awk -v key=\"${peer}\" '$1 == key {for\
    \ (i=2; i<=NF; i++) printf \"%s%s\", (i==2 ? \"\" : \",\"), $i; print \"\"; exit}')\"\
    \n      original=\"${allowed}\"\n      for prefix in 10.250.0.1/32 $(jq -r '.relayNodes[]?\
    \ | (.acceleratedIp + \"/32\"), (.podCIDR // empty)' /config/inventory.json);\
    \ do\n        case \",${allowed},\" in *\",${prefix},\"*) : ;; *) allowed=\"${allowed},${prefix}\"\
    \ ;; esac\n      done\n      [ \"${allowed}\" = \"${original}\" ] || host wg set\
    \ \"${iface}\" peer \"${peer}\" allowed-ips \"${allowed}\"\n    fi\n    # ECMP\
    \ can send a socket sourced from either tunnel across this iface.\n    for source_fabric\
    \ in 93 94; do\n      for api_ip in 10.250.0.1 $(jq -r '.routeServers[], .relayNodes[]?\
    \ | .acceleratedIp' /config/inventory.json); do\n        rule=\"ip saddr 172.31.${source_fabric}.${last}\
    \ ip daddr ${api_ip} tcp dport 6443 oifname \\\"${iface}\\\" snat to ${identity}\"\
    \n        host nft list chain ip re8ch_control_api_snat postrouting | grep -Fq\
    \ \"${rule}\" ||\n          host nft add rule ip re8ch_control_api_snat postrouting\
    \ ip saddr \"172.31.${source_fabric}.${last}/32\" ip daddr \"${api_ip}/32\" tcp\
    \ dport 6443 oifname \"${iface}\" snat to \"${identity}\"\n      done\n    done\n\
    \  done\n  [ \"${active}\" = 1 ] && touch /run/control-api-source-ready\n  sleep\
    \ 60\ndone\n"
