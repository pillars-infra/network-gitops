  public-mesh-podcidr-reconcile.sh: "#!/bin/sh\n# Reconcile only explicitly paired\
    \ public-mesh PodCIDR BGP policies.\nset -eu\n\nhost() { nsenter -t 1 -n chroot\
    \ /host \"$@\"; }\nloaded_revision=\"$(sha256sum /config/public-mesh.json /config/reconcile.sh)\"\
    \nnode=\"$(jq -c --arg name \"$NODE_NAME\" '.nodes[] | select(.name == $name)'\
    \ /config/public-mesh.json)\"\n[ -n \"$node\" ] || exit 2\nown_id=\"$(printf '%s'\
    \ \"$node\" | jq -r .id)\"\nown_asn=\"$(printf '%s' \"$node\" | jq -r .asn)\"\n\
    own_pod=\"$(printf '%s' \"$node\" | jq -r .podCIDR)\"\n[ \"$own_pod\" != null\
    \ ] || exit 2\n\nreconcile_peer() {\n  peer_name=\"$1\"\n  peer=\"$(jq -c --arg\
    \ name \"$peer_name\" '.nodes[] | select(.name == $name)' /config/public-mesh.json)\"\
    \n  [ -n \"$peer\" ] || return 1\n  printf '%s' \"$peer\" | jq -e --arg name \"\
    $NODE_NAME\" '.podCIDRPeers | index($name) != null' >/dev/null\n  peer_id=\"$(printf\
    \ '%s' \"$peer\" | jq -r .id)\"\n  peer_ip=\"$(printf '%s' \"$peer\" | jq -r .transportIp)\"\
    \n  peer_pod=\"$(printf '%s' \"$peer\" | jq -r .podCIDR)\"\n  [ \"$peer_pod\"\
    \ != null ] || return 1\n  # Never advertise a PodCIDR into a tunnel that cannot\
    \ carry the return path.\n  host wg show wg-public-mesh allowed-ips | awk -v transport=\"\
    ${peer_ip}/32\" -v pod=\"$peer_pod\" '\n    { found_transport=0; found_pod=0;\
    \ for(i=2;i<=NF;i++){if($i==transport)found_transport=1;if($i==pod)found_pod=1}\
    \ if(found_transport && found_pod)ok=1 }\n    END { exit !ok }' || return 1\n\
    \  host vtysh -c 'show bgp ipv4 unicast summary json' | jq -e --arg ip \"$peer_ip\"\
    \ '.peers[$ip].state == \"Established\"' >/dev/null || return 1\n\n  config=\"\
    $(host vtysh -c 'show running-config')\"\n  printf '%s\\n' \"$config\" | grep\
    \ -Fqx \"  network $own_pod\" || return 1\n  inbound=\"FROM-$peer_id\"\n  outbound=\"\
    RE8CH-POD-TO-$peer_id\"\n  # LA1 receives the API VIP as an additional R640 prefix.\n\
    \  maximum=2\n  if printf '%s' \"$node\" | jq -e --arg name \"$peer_name\" '.apiVipVia.peer\
    \ == $name' >/dev/null; then\n    maximum=3\n  fi\n  relay_vip=\"$(printf '%s'\
    \ \"$peer\" | jq -r --arg name \"$NODE_NAME\" 'if .apiVipVia.peer == $name then\
    \ .apiVipVia.prefix else empty end')\"\n  identity=\"10.250.0.$own_id/32\"\n \
    \ if ! printf '%s\\n' \"$config\" | grep -Fqx \"ip prefix-list $inbound seq 20\
    \ permit $peer_pod\" &&\n     ! printf '%s\\n' \"$config\" | grep -Fqx \"ip prefix-list\
    \ $inbound seq 30 permit $peer_pod\"; then\n    sequence=20\n    if printf '%s\\\
    n' \"$config\" | grep -Fq \"ip prefix-list $inbound seq 20 \"; then sequence=30;\
    \ fi\n    if printf '%s\\n' \"$config\" | grep -Fq \"ip prefix-list $inbound seq\
    \ $sequence \"; then return 1; fi\n    host vtysh -c 'configure terminal' -c \"\
    ip prefix-list $inbound seq $sequence permit $peer_pod\" -c end\n  fi\n  config=\"\
    $(host vtysh -c 'show running-config')\"\n  if printf '%s\\n' \"$config\" | grep\
    \ -Fqx \"ip prefix-list $outbound seq 10 permit $identity\" &&\n     printf '%s\\\
    n' \"$config\" | grep -Fqx \"ip prefix-list $outbound seq 20 permit $own_pod\"\
    \ &&\n     printf '%s\\n' \"$config\" | grep -Fqx \"  neighbor $peer_ip prefix-list\
    \ $outbound out\" &&\n     printf '%s\\n' \"$config\" | grep -Fqx \"  neighbor\
    \ $peer_ip maximum-prefix $maximum 90 restart 5\"; then\n    if [ -z \"$relay_vip\"\
    \ ] || printf '%s\\n' \"$config\" | grep -Fqx \"ip prefix-list $outbound seq 30\
    \ permit $relay_vip\"; then return 0; fi\n  fi\n  # The owned list is scoped to\
    \ this one neighbor. Keep all other FRR policy.\n  host vtysh -c 'configure terminal'\
    \ -c \"no ip prefix-list $outbound\" -c \"ip prefix-list $outbound seq 10 permit\
    \ $identity\" -c \"ip prefix-list $outbound seq 20 permit $own_pod\" -c end\n\
    \  if [ -n \"$relay_vip\" ]; then\n    host vtysh -c 'configure terminal' -c \"\
    ip prefix-list $outbound seq 30 permit $relay_vip\" -c end\n  fi\n  host vtysh\
    \ -c 'configure terminal' -c \"router bgp $own_asn\" -c 'address-family ipv4 unicast'\
    \ -c \"neighbor $peer_ip maximum-prefix $maximum 90 restart 5\" -c \"neighbor\
    \ $peer_ip prefix-list $outbound out\" -c end\n  host vtysh -c \"clear ip bgp\
    \ $peer_ip soft\"\n  host vtysh -c 'write memory'\n}\n\nwhile :; do\n  if [ \"\
    $loaded_revision\" != \"$(sha256sum /config/public-mesh.json /config/reconcile.sh)\"\
    \ ]; then\n    exec /bin/sh /config/reconcile.sh\n  fi\n  printf '%s' \"$node\"\
    \ | jq -r '.podCIDRPeers[]' | while read -r peer_name; do\n    reconcile_peer\
    \ \"$peer_name\" || echo \"$NODE_NAME: public-mesh PodCIDR peer $peer_name not\
    \ yet ready\" >&2\n  done\n  sleep 30\ndone\n"
