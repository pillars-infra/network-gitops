apiVersion: batch/v1
kind: Job
metadata:
  name: among-clusters-legacy-agent-cleanup-v2
  namespace: flux-system
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - args:
        - "api=https://kubernetes.default.svc/apis/helm.toolkit.fluxcd.io/v2/namespaces/flux-system/helmreleases/among-clusters-hub-agent\n\
          token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\ncode=$(curl\
          \ --silent --show-error --output /tmp/response --write-out '%{http_code}'\
          \ \\\n  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \\\
          \n  --header \"Authorization: Bearer $token\" \\\n  --request DELETE \"\
          $api\")\ncase \"$code\" in\n  200|202|404) ;;\n  *) cat /tmp/response >&2;\
          \ exit 1 ;;\nesac\nold_job=https://kubernetes.default.svc/apis/batch/v1/namespaces/flux-system/jobs/among-clusters-legacy-agent-cleanup\n\
          code=$(curl --silent --show-error --output /tmp/response --write-out '%{http_code}'\
          \ \\\n  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \\\
          \n  --header \"Authorization: Bearer $token\" \\\n  --request DELETE \"\
          $old_job\")\ncase \"$code\" in\n  200|202|404) exit 0 ;;\n  *) cat /tmp/response\
          \ >&2; exit 1 ;;\nesac\n"
        command:
        - /bin/sh
        - -ec
        image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
        name: delete-legacy-release
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 100
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: among-clusters-legacy-agent-cleanup
      volumes:
      - emptyDir: {}
        name: tmp
  ttlSecondsAfterFinished: 86400
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: among-clusters-legacy-agent-cleanup
  namespace: flux-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-zone-hooks-github-flux-webhook
  namespace: flux-system
spec:
  hostnames:
  - hooks.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: webhook-receiver
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /hook/
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: among-clusters-legacy-agent-cleanup
  namespace: flux-system
rules:
- apiGroups:
  - helm.toolkit.fluxcd.io
  resourceNames:
  - among-clusters-hub-agent
  resources:
  - helmreleases
  verbs:
  - get
  - delete
- apiGroups:
  - batch
  resourceNames:
  - among-clusters-legacy-agent-cleanup
  resources:
  - jobs
  verbs:
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mihomo-node-labeler-inventory
  namespace: flux-system
rules:
- apiGroups:
  - ''
  resourceNames:
  - cluster-node-inventory
  resources:
  - configmaps
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: among-clusters-legacy-agent-cleanup
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: among-clusters-legacy-agent-cleanup
subjects:
- kind: ServiceAccount
  name: among-clusters-legacy-agent-cleanup
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mihomo-node-labeler-inventory
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mihomo-node-labeler-inventory
subjects:
- kind: ServiceAccount
  name: mihomo-node-labeler
  namespace: egress-fabric
