apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: among-clusters-legacy-agent-cleanup
  namespace: flux-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-zone-hooks-github-flux-webhook
  namespace: flux-system
spec:
  hostnames:
  - hooks.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: webhook-receiver
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /hook/
