apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: powerdns-cloud-authorities
  namespace: regional-routing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: powerdns-cloud-authorities
  template:
    metadata:
      annotations:
        networking.re8ch.com/authority-source-revision: independent-cn-eu-v1
      labels:
        app.kubernetes.io/name: powerdns-cloud-authorities
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: networking.re8ch.com/powerdns-authority-capable
                operator: In
                values:
                - 'true'
      containers:
      - args:
        - "# Bind only the primary NIC; systemd-resolved owns loopback :53.\naddr=$(hostname\
          \ -I | awk '{print $1}')\ntest -n \"$addr\"\nexec /usr/local/sbin/pdns_server\
          \ --daemon=no --guardian=no \\\n  --config-dir=/etc/powerdns --local-address=\"\
          $addr\"\n"
        command:
        - sh
        - -ec
        image: docker.io/powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - test -S /var/run/pdns/pdns.controlsocket
          periodSeconds: 30
        name: pdns-auth
        ports:
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - test -S /var/run/pdns/pdns.controlsocket
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 192Mi
          requests:
            cpu: 20m
            memory: 48Mi
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /etc/powerdns
          name: config
          readOnly: true
        - mountPath: /var/lib/powerdns
          name: data
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - sh
        - -c
        - chown -R pdns:pdns /var/lib/powerdns
        image: docker.io/powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
        name: data-permissions
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/powerdns
          name: data
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      - effect: NoSchedule
        key: node.cilium.io/agent-not-ready
        operator: Exists
      volumes:
      - configMap:
          name: powerdns-cloud-authorities
        name: config
      - hostPath:
          path: /var/lib/re8ch/powerdns-authority
          type: DirectoryOrCreate
        name: data
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
