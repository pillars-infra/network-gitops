apiVersion: v1
data:
  dns-router.py: "import socket\nimport struct\nimport threading\n\nBIND = (\"127.0.0.1\"\
    , 5300)\nGEO = (\"127.0.0.1\", 5301)\nGEO_NAME = \"kube-api.service.re8ch.com\"\
    \n\ndef qname(packet):\n    labels = []\n    offset = 12\n    while offset < len(packet):\n\
    \        length = packet[offset]\n        offset += 1\n        if length == 0:\n\
    \            return \".\".join(labels).lower()\n        if length & 0xC0 or offset\
    \ + length > len(packet):\n            return \"\"\n        labels.append(packet[offset:offset\
    \ + length].decode(\"ascii\", \"ignore\"))\n        offset += length\n    return\
    \ \"\"\n\ndef backend(packet):\n    return GEO if qname(packet) == GEO_NAME else\
    \ BIND\n\ndef udp_query(listener, packet, client):\n    try:\n        with socket.socket(socket.AF_INET,\
    \ socket.SOCK_DGRAM) as upstream:\n            upstream.settimeout(3)\n      \
    \      upstream.sendto(packet, backend(packet))\n            response, _ = upstream.recvfrom(65535)\n\
    \            listener.sendto(response, client)\n    except OSError:\n        pass\n\
    \ndef udp_server():\n    listener = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\n\
    \    listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    listener.bind((\"\
    0.0.0.0\", 53))\n    while True:\n        packet, client = listener.recvfrom(65535)\n\
    \        threading.Thread(target=udp_query, args=(listener, packet, client), daemon=True).start()\n\
    \ndef read_exact(stream, size):\n    data = b\"\"\n    while len(data) < size:\n\
    \        part = stream.recv(size - len(data))\n        if not part:\n        \
    \    raise ConnectionError\n        data += part\n    return data\n\ndef tcp_client(client):\n\
    \    with client:\n        client.settimeout(10)\n        while True:\n      \
    \      try:\n                size = struct.unpack(\"!H\", read_exact(client, 2))[0]\n\
    \                packet = read_exact(client, size)\n                with socket.create_connection(backend(packet),\
    \ timeout=3) as upstream:\n                    upstream.sendall(struct.pack(\"\
    !H\", size) + packet)\n                    reply_size = struct.unpack(\"!H\",\
    \ read_exact(upstream, 2))[0]\n                    reply = read_exact(upstream,\
    \ reply_size)\n                client.sendall(struct.pack(\"!H\", reply_size)\
    \ + reply)\n            except (OSError, ConnectionError, struct.error):\n   \
    \             return\n\ndef tcp_server():\n    listener = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\n    listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR,\
    \ 1)\n    listener.bind((\"0.0.0.0\", 53))\n    listener.listen(128)\n    while\
    \ True:\n        client, _ = listener.accept()\n        threading.Thread(target=tcp_client,\
    \ args=(client,), daemon=True).start()\n\nthreading.Thread(target=udp_server,\
    \ daemon=True).start()\ntcp_server()\n"
  geoip.yaml: "domains:\n- domain: kube-api.service.re8ch.com\n  ttl: 30\n  records:\n\
    \    kube-api.service.re8ch.com:\n    - soa: ns-domain-ex.re8ch.com hostmaster.re8ch.com\
    \ 2026112101 60 60 86400 30\n    - ns: ns-domain-ex.re8ch.com\n    - ns: ns-zan.re8ch.com\n\
    \    - ns: ns-muaya-lightweight.re8ch.com\n    cn.kube-api.service.re8ch.com:\n\
    \    - a: 223.159.210.222\n    af.kube-api.service.re8ch.com:\n    - a: 2.28.106.230\n\
    \    an.kube-api.service.re8ch.com:\n    - a: 2.28.106.230\n    as.kube-api.service.re8ch.com:\n\
    \    - a: 2.28.106.230\n    eu.kube-api.service.re8ch.com:\n    - a: 2.28.106.230\n\
    \    na.kube-api.service.re8ch.com:\n    - a: 2.28.106.230\n    oc.kube-api.service.re8ch.com:\n\
    \    - a: 2.28.106.230\n    sa.kube-api.service.re8ch.com:\n    - a: 2.28.106.230\n\
    \    global.kube-api.service.re8ch.com:\n    - a: 2.28.106.230\n  services:\n\
    \    kube-api.service.re8ch.com:\n    - '%cc.kube-api.service.re8ch.com'\n   \
    \ - '%cn.kube-api.service.re8ch.com'\n    - global.kube-api.service.re8ch.com\n"
  named.conf: 'zone "api.re8ch.com" { type slave; file "/var/lib/powerdns/api.re8ch.com.zone";
    masters { 42.194.130.91; 2.28.106.230; 179.255.126.104; }; };

    zone "db-ro.re8ch.com" { type slave; file "/var/lib/powerdns/db-ro.re8ch.com.zone";
    masters { 42.194.130.91; 2.28.106.230; 179.255.126.104; }; };

    zone "db-rw.re8ch.com" { type slave; file "/var/lib/powerdns/db-rw.re8ch.com.zone";
    masters { 42.194.130.91; 2.28.106.230; 179.255.126.104; }; };

    zone "service.re8ch.com" { type slave; file "/var/lib/powerdns/service.re8ch.com.zone";
    masters { 42.194.130.91; 2.28.106.230; 179.255.126.104; }; };

    zone "functions.re8ch.com" { type slave; file "/var/lib/powerdns/functions.re8ch.com.zone";
    masters { 42.194.130.91; 2.28.106.230; 179.255.126.104; }; };

    zone "test.re8ch.com" { type slave; file "/var/lib/powerdns/test.re8ch.com.zone";
    masters { 42.194.130.91; 2.28.106.230; 179.255.126.104; }; };

    '
  pdns.conf: 'launch=bind

    bind-config=/etc/powerdns/named.conf

