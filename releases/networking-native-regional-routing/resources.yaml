    external-dns.alpha.kubernetes.io/target: catalog.re8ch.com.eo.dnse1.com
    external-dns.alpha.kubernetes.io/ttl: '60'
  labels:
    networking.re8ch.com/dns-authority: public-edge
  name: catalog-edgeone-dns-authority
  namespace: regional-routing
spec:
  ingressClassName: external-dns-only
  rules:
  - host: catalog.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: public-edge-manager
            port:
              number: 8080
        path: /
        pathType: Prefix
