apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-edge-origin
  namespace: headlamp
spec:
  hostnames:
  - headlamp.re8ch.com
  parentRefs:
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: http
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: http
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: http
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: http
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: http
  rules:
  - backendRefs:
    - name: headlamp-gateway-backend
      port: 80
    filters:
    - responseHeaderModifier:
        set:
        - name: X-Re8ch-Gateway
          value: cilium
      type: ResponseHeaderModifier
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-http-redirect
  namespace: headlamp
spec:
  hostnames:
  - headlamp.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  rules:
  - filters:
    - requestRedirect:
        port: 443
        scheme: https
        statusCode: 308
      type: RequestRedirect
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: '60'
  name: headlamp-public
  namespace: headlamp
spec:
  hostnames:
  - headlamp.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: headlamp-https
  - name: re8ch-region-loudi
    namespace: kube-system
    sectionName: headlamp-https
  - name: re8ch-region-guangzhou
    namespace: kube-system
    sectionName: headlamp-https
  - name: re8ch-region-shanghai
    namespace: kube-system
    sectionName: headlamp-https
  - name: re8ch-region-hangzhou-nuclio
    namespace: kube-system
    sectionName: headlamp-https
  - name: re8ch-region-shanghai-nuclio
    namespace: kube-system
    sectionName: headlamp-https
  rules:
  - backendRefs:
    - name: headlamp-gateway-backend
      port: 80
    filters:
    - responseHeaderModifier:
        set:
        - name: X-Re8ch-Gateway
          value: cilium
      type: ResponseHeaderModifier
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-service-public
  namespace: headlamp
spec:
  hostnames:
  - headlamp.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - name: headlamp-oidc-landing
      port: 80
    matches:
    - path:
        type: Exact
        value: /auth
  - backendRefs:
    - name: headlamp-gateway-backend
      port: 80
