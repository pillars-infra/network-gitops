apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/ttl: '60'
  labels:
    public.re8ch.com/external-dns: enabled
  name: phonycenter-public
  namespace: voice-observability
spec:
  hostnames:
  - phonycenter.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  rules:
  - backendRefs:
    - name: homer-ui
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phonycenter-service-public
  namespace: voice-observability
spec:
  hostnames:
  - phonycenter.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - name: homer-ui
      port: 80
