  namespace: supabase-pg-re8ch
spec:
  hostnames:
  - supabase.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - name: supabase-api-kong
      port: 8000
