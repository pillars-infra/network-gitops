apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/hostname: operate.tools.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: '60'
    networking.re8ch.com/provider: public-edge-manager
  labels:
    networking.re8ch.com/dns-authority: public-edge
  name: operate-tools-public-dns
  namespace: toolhive-system
spec:
  ingressClassName: external-dns-only
  rules:
  - host: operate.tools.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: re8ch-operate-vmcp-session-router
            port:
              number: 4483
        path: /
        pathType: Prefix
