apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: operate-tools-public
  namespace: toolhive-system
spec:
  hostnames:
  - operate.tools.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: tools-wildcard-https
  rules:
  - backendRefs:
    - name: re8ch-operate-vmcp-session-router
      port: 4483
    matches:
    - path:
        type: PathPrefix
        value: /mcp
    - path:
        type: PathPrefix
        value: /.well-known
