apiVersion: v1
kind: ServiceAccount
metadata:
  name: among-clusters-agent
  namespace: among-clusters
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-agent
  namespace: among-clusters
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-agent
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - ipBlock: {cidr: 2.29.219.31/32}
    ports:
    - {protocol: TCP, port: 6443}
  - to:
    - ipBlock: {cidr: 0.0.0.0/0}
    ports:
    - {protocol: TCP, port: 443}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: among-clusters-agent
  namespace: among-clusters
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: among-clusters-agent
    spec:
      serviceAccountName: among-clusters-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: agent
        image: ghcr.io/among-clusters/among-clusters@sha256:27288e43138c052e9804600c512f296832b2037ea9a016e04a08adb4bb024629
        command: [/agent]
        env:
        - {name: CLUSTER_ID, value: re8ch-atlantic}
        - {name: TENANT, value: byoc-pilot}
        - {name: TRUST_DOMAIN, value: atlantic.re8ch.com}
        - {name: HUB_ENDPOINT, value: 'https://among-clusters.service.re8ch.com'}
        - {name: BROKER_ENDPOINT, value: 'https://among-clusters.service.re8ch.com/broker'}
        - {name: SYNC_INTERVAL, value: 1m}
        - {name: IDENTITY_SECRET, value: among-clusters-agent-identity}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: INVITATION_TOKEN
          valueFrom: {secretKeyRef: {name: among-clusters-invitation, key: token, optional: true}}
        - name: INVITATION_ID
          valueFrom: {secretKeyRef: {name: among-clusters-invitation, key: invitation-id, optional: true}}
        - {name: GATEWAY_ENDPOINT, value: ''}
        - name: PEER_CONFIRMATIONS
          value: '[{"bundleDigest":"sha256:1c033ad2260b1064dd46705361dce35d1c47e8332864a88d239a90b5ffa557e8","peerRef":"re8ch-atlantic"}]'
        - {name: LINK_OBSERVATIONS, value: '[]'}
        - {name: PEER_BUNDLE_FILE, value: /peer-bundles/ca.crt}
        - {name: KUBERNETES_TLS_SERVER_NAME, value: kubernetes.default.svc}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
        volumeMounts:
        - {name: kubernetes-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      volumes:
      - name: kubernetes-api
        projected:
          sources:
          - serviceAccountToken: {path: token, expirationSeconds: 3600}
          - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
          - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: among-clusters-edge-sni
  namespace: among-clusters
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn 4096
    defaults
      mode tcp
      log global
      timeout connect 5s
      timeout client 1m
      timeout server 1m
    frontend atlantic_tls
      bind :8444
      tcp-request inspect-delay 5s
      tcp-request content accept if { req.ssl_hello_type 1 }
      use_backend main_kube_api if { req.ssl_sni -i kube-api.re8ch.com kube-api.service.re8ch.com }
      default_backend main_public_edge
    backend main_kube_api
      server gateway among-clusters-gateway.among-clusters.svc.cluster.local:16443 check inter 2s fall 2 rise 2
    backend main_public_edge
      server gateway among-clusters-gateway.among-clusters.svc.cluster.local:16445 check inter 2s fall 2 rise 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: among-clusters-approval-re8ch-atlantic-headlamp-admin
  namespace: among-clusters
data:
  approved: "true"
  generation: "1"
  grantRef: re8ch-atlantic-headlamp-admin
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-gateway
  namespace: among-clusters
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-gateway
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - {protocol: TCP, port: 17891}
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: among-clusters-edge
    ports:
    - {protocol: TCP, port: 16443}
    - {protocol: TCP, port: 16445}
  egress:
  - to:
    - ipBlock: {cidr: 223.159.210.222/32}
    ports:
    - {protocol: UDP, port: 8443}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: egress-fabric
    ports:
    - {protocol: TCP, port: 1080}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: mail-system
    ports:
    - {protocol: TCP, port: 80}
    - {protocol: TCP, port: 443}
    - {protocol: TCP, port: 8080}
    # NetworkPolicy evaluates the post-DNAT webmail container port.
    - {protocol: TCP, port: 3000}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - {protocol: TCP, port: 443}
  - to:
    - ipBlock: {cidr: 2.29.219.31/32}
    ports:
    - {protocol: TCP, port: 6443}
  - to:
    - ipBlock: {cidr: 179.253.231.159/32}
    ports:
    - {protocol: TCP, port: 1080}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: among-clusters-gateway
  namespace: among-clusters
spec:
  # A peer identity owns exactly one authenticated hub session. Public ingress
  # is fanned out separately by the node-local edge DaemonSet below.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-gateway
  template:
    metadata:
      annotations:
        networking.re8ch.com/haproxy-config-sha256: 7b3e57de0f77800f2e635f617724ed3c68444480806e829a83eb88e118bc7085
      labels:
        app.kubernetes.io/name: among-clusters-gateway
    spec:
      automountServiceAccountToken: false
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: gateway
        image: ghcr.io/among-clusters/among-clusters@sha256:a80367067b256d0c2989485a0926a9a669affed89f224b6f0adb4cf18bf9be05
        command: [/gateway]
        env:
        - {name: LISTEN_ADDRESS, value: ':8443'}
        - {name: LISTENER_ENABLED, value: 'false'}
        - name: EXPORTS_JSON
          value: '[{"serviceIdentity":"spiffe://atlantic.re8ch.com/ns/egress-fabric/service/mihomos-global-exit-atlantic","target":"mihomos-global-exit-atlantic.egress-fabric.svc.cluster.local:1080","targetPeers":["re8ch-main"]},{"serviceIdentity":"spiffe://atlantic.re8ch.com/ns/default/service/kubernetes","target":"kubernetes.default.svc.cluster.local:443","targetPeers":["re8ch-main"]},{"serviceIdentity":"spiffe://atlantic.re8ch.com/ns/mail-system/service/stalwart-webmail","target":"stalwart-webmail.mail-system.svc.cluster.local:80","targetPeers":["re8ch-main"]},{"serviceIdentity":"spiffe://atlantic.re8ch.com/ns/mail-system/service/stalwart-idp","target":"stalwart-idp.mail-system.svc.cluster.local:8080","targetPeers":["re8ch-main"]},{"serviceIdentity":"spiffe://atlantic.re8ch.com/ns/mail-system/service/stalwart-management","target":"stalwart.mail-system.svc.cluster.local:8080","targetPeers":["re8ch-main"]}]'
        - {name: EXPORTS_FILE, value: /routes/exports.json}
        - name: IMPORTS_JSON
          value: '[{"listen":":17891","serviceIdentity":"spiffe://re8ch.internal/ns/egress-fabric/service/mihomos-byoc-egress","expectedSPIFFEID":"spiffe://re8ch.internal/cluster/re8ch","sessionOnly":true},{"listen":":16443","serviceIdentity":"spiffe://re8ch.internal/ns/kube-system/service/kubernetes-api","expectedSPIFFEID":"spiffe://re8ch.internal/cluster/re8ch","sessionOnly":true},{"listen":":16445","serviceIdentity":"spiffe://re8ch.internal/ns/kube-system/service/public-edge-tls","expectedSPIFFEID":"spiffe://re8ch.internal/cluster/re8ch","sessionOnly":true}]'
        - name: PEER_SESSIONS_JSON
          value: '[{"endpoint":"223.159.210.222:8443","expectedSPIFFEID":"spiffe://re8ch.internal/cluster/re8ch"}]'
        - name: PEER_IDENTITIES_JSON
          value: '{"re8ch-atlantic":["spiffe://re8ch.internal/cluster/re8ch"],"re8ch-main":["spiffe://re8ch.internal/cluster/re8ch"]}'
        ports:
        - {name: main-egress, containerPort: 17891, protocol: TCP}
        - {name: main-kube-api, containerPort: 16443, protocol: TCP}
        - {name: public-edge, containerPort: 16445, protocol: TCP}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
        volumeMounts:
        - {name: identity, mountPath: /identity, readOnly: true}
        - {name: service-routes, mountPath: /routes, readOnly: true}
        - {name: peer-bundles, mountPath: /peer-bundles, readOnly: true}
      volumes:
      - name: identity
        secret: {secretName: among-clusters-agent-identity}
      - name: service-routes
        configMap: {name: among-clusters-service-routes}
      - name: peer-bundles
        secret: {secretName: among-clusters-peer-bundle}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: among-clusters-edge
  namespace: among-clusters
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-edge
  template:
    metadata:
      annotations:
        networking.re8ch.com/haproxy-config-sha256: 7b3e57de0f77800f2e635f617724ed3c68444480806e829a83eb88e118bc7085
      labels:
        app.kubernetes.io/name: among-clusters-edge
    spec:
      automountServiceAccountToken: false
      tolerations:
      - key: dedicated
        operator: Equal
        value: overseas-edge
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: edge-sni
        image: docker.io/library/haproxy@sha256:7816a9801a6846b912bc37e48529808e2fa87c3c47992441940f68e393ebcfeb
        args: [-W, -db, -f, /usr/local/etc/haproxy/haproxy.cfg]
        ports:
        - {name: public-tls, containerPort: 8444, hostPort: 443, protocol: TCP}
        readinessProbe: {tcpSocket: {port: public-tls}, periodSeconds: 3, timeoutSeconds: 1}
        livenessProbe: {tcpSocket: {port: public-tls}, periodSeconds: 15, timeoutSeconds: 1}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 99
          runAsGroup: 99
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: edge-sni, mountPath: /usr/local/etc/haproxy, readOnly: true}
      volumes:
      - name: edge-sni
        configMap: {name: among-clusters-edge-sni}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-edge
  namespace: among-clusters
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-edge
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - ipBlock: {cidr: 0.0.0.0/0}
    ports:
    - {protocol: TCP, port: 8444}
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: among-clusters-gateway
    ports:
    - {protocol: TCP, port: 16443}
    - {protocol: TCP, port: 16445}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
---
apiVersion: v1
kind: Service
metadata:
  name: among-clusters-gateway
  namespace: among-clusters
spec:
  selector:
    app.kubernetes.io/name: among-clusters-gateway
  ports:
  - {name: main-egress, port: 17891, targetPort: main-egress, protocol: TCP}
  - {name: main-kube-api, port: 16443, targetPort: main-kube-api, protocol: TCP}
  - {name: public-edge, port: 16445, targetPort: public-edge, protocol: TCP}
