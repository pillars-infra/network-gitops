apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opensandbox-service-public
  namespace: opensandbox-system
spec:
  hostnames:
  - opensandbox.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - name: opensandbox-server
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: '60'
  labels:
    app.kubernetes.io/name: opensandbox-server
    public.re8ch.com/external-dns: enabled
  name: opensandbox-server
  namespace: opensandbox-system
spec:
  ingressClassName: external-dns-only
  rules:
  - host: opensandbox.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: opensandbox-server
            port:
              name: http
        path: /
        pathType: Prefix
