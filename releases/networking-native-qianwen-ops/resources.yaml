apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: cloudflare-re8ch
    app.kubernetes.io/name: external-dns
  name: external-dns-cloudflare
  namespace: qianwen-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: cloudflare-re8ch
      app.kubernetes.io/name: external-dns
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: cloudflare-re8ch
        app.kubernetes.io/name: external-dns
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - a1-wsl-zt
                - b1-wsl-zt
      containers:
      - args:
        - --source=ingress
        - --source=service
        - --provider=cloudflare
        - --domain-filter=re8ch.com
        - --label-filter=networking.re8ch.com/dns-authority=public-edge
        - --exclude-target-net=10.0.0.0/8
        - --exclude-target-net=172.16.0.0/12
        - --exclude-target-net=192.168.0.0/16
        - --policy=upsert-only
        - --registry=noop
        - --interval=1m
        - --events
        - --log-format=json
        - --log-level=info
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: 10.250.0.1
        - name: KUBERNETES_SERVICE_PORT
          value: '6443'
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: CF_API_TOKEN
              name: cloudflare-pg-dns-controller-secret
        image: ghcr.io/re8ch/external-dns:v0.21.0@sha256:99160687de6c703460ed1b792ccb985012a96cfb787109427b87b70faa69b33e
        name: external-dns
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      imagePullSecrets:
      - name: ghcr-re8ch
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: external-dns-cloudflare
      tolerations:
      - effect: NoSchedule
        key: storage.re8ch.com/coordinator
        operator: Equal
        value: 'true'
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-apps-dns-placeholder
  namespace: qianwen-ops
spec:
  ports:
  - name: dns-only
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns-cloudflare
  namespace: qianwen-ops
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/hostname: '*.apps.re8ch.com'
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: '60'
  labels:
    networking.re8ch.com/dns-authority: public-edge
  name: tenant-apps-wildcard-dns-authority
  namespace: qianwen-ops
spec:
  ingressClassName: external-dns-only
  rules:
  - host: '*.apps.re8ch.com'
    http:
      paths:
      - backend:
          service:
            name: tenant-apps-dns-placeholder
            port:
              name: dns-only
        path: /
        pathType: Prefix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-cloudflare-dns-token
  namespace: qianwen-ops
rules:
- apiGroups:
  - ''
  resourceNames:
  - cloudflare-pg-dns-controller-secret
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-read-cloudflare-dns-token
  namespace: qianwen-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-cloudflare-dns-token
subjects:
- kind: ServiceAccount
  name: cert-manager-cloudflare-bootstrap
  namespace: cert-manager
