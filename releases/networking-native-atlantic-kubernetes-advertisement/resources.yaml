apiVersion: v1
kind: Service
metadata:
  name: kubernetes
  namespace: default
  labels:
    peering.re8ch.com/advertise: "true"
  annotations:
    peering.re8ch.com/protocol: kubernetes-api
    peering.re8ch.com/service-class: kubernetes.control-plane
    peering.re8ch.com/policy-ref: re8ch-atlantic-kubernetes-api
    peering.re8ch.com/target-peers: re8ch-atlantic
    peering.re8ch.com/port-name: https
    peering.re8ch.com/ttl-seconds: "3600"
