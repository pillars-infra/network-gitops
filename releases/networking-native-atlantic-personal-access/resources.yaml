apiVersion: v1
kind: Service
metadata:
  name: personal-access-atlantic
  namespace: egress-fabric
spec:
  selector:
    app.kubernetes.io/name: personal-access-atlantic
  ports:
  - {name: anytls, port: 24443, targetPort: anytls, protocol: TCP}
  - {name: hysteria2, port: 24444, targetPort: hysteria2, protocol: UDP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: personal-access-atlantic
  namespace: egress-fabric
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: personal-access-atlantic
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - ipBlock: {cidr: 0.0.0.0/0}
    ports:
    - {port: 24443, protocol: TCP}
    - {port: 24444, protocol: UDP}
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {port: 53, protocol: TCP}
    - {port: 53, protocol: UDP}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mihomos-global-exit-atlantic
    ports:
    - {port: 1080, protocol: TCP}
    - {port: 1080, protocol: UDP}
