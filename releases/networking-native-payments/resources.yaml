apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-zone-pay-hyperswitch-control-center-public
  namespace: payments
spec:
  hostnames:
  - pay.service.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: hyperswitch-control-center
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
