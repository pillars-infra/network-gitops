apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels: {}
  name: stalwart-flk
  namespace: mail-system
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  serviceName: stalwart-headless
  template:
    metadata:
      annotations:
        governance.re8ch.com/mail-authority: staged
        governance.re8ch.com/stalwart-migration-phase: production-v1
        incident.re8ch.com/probe-mode: tcp-management-20261101
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      containers:
        - args:
            - --config
            - /etc/stalwart/config.json
          env:
            - name: STALWART_PUBLIC_URL
              value: https://id.re8ch.com
          envFrom:
            - secretRef:
                name: stalwart-recovery-admin
          image: ghcr.io/stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 20
            periodSeconds: 20
            successThreshold: 1
            tcpSocket:
              port: management
            timeoutSeconds: 10
          name: stalwart
          ports:
            - containerPort: 25
              name: smtp
              protocol: TCP
            - containerPort: 465
              name: smtps
              protocol: TCP
            - containerPort: 587
              name: submission
              protocol: TCP
            - containerPort: 143
              name: imap
              protocol: TCP
            - containerPort: 993
              name: imaps
              protocol: TCP
            - containerPort: 110
              name: pop3
              protocol: TCP
            - containerPort: 995
              name: pop3s
              protocol: TCP
            - containerPort: 4190
              name: sieve
              protocol: TCP
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
            - containerPort: 8080
              name: management
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: management
            timeoutSeconds: 10
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            failureThreshold: 60
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: management
            timeoutSeconds: 10
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/stalwart
              name: config
              readOnly: true
            - mountPath: /var/lib/stalwart
              name: data
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/stalwart-tls
              name: mail-tls
              readOnly: true
            - mountPath: /var/run/stalwart-secrets/cloudflare
              name: cloudflare-token
              readOnly: true
            - mountPath: /var/run/stalwart-secrets/cloudflare-re8ch
              name: cloudflare-re8ch-token
              readOnly: true
            - mountPath: /var/run/stalwart-idp
              name: oidc-keys
              readOnly: true
            - mountPath: /var/run/stalwart-secrets/metrics
              name: metrics-auth
              readOnly: true
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
        options:
          - name: ndots
            value: "1"
      dnsPolicy: None
      initContainers:
        - args:
            - |
              until [ -f /var/lib/stalwart/.r640-migration-v2-complete ]; do sleep 5; done
              test -f /var/lib/stalwart/database/CURRENT
          command:
            - /bin/sh
            - -ceu
          image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
          imagePullPolicy: IfNotPresent
          name: wait-for-migration
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/stalwart
              name: data
              readOnly: true
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: overseas-edge
        - effect: NoSchedule
          key: scheduling.re8ch.com/capacity-window
          operator: Equal
          value: closed
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stalwart-rehearsal-target-v1-local
        - configMap:
            defaultMode: 420
            name: stalwart-config
          name: config
        - emptyDir: {}
          name: tmp
        - name: mail-tls
          secret:
            defaultMode: 420
            secretName: stalwart-mail-re8ch-tls
        - name: cloudflare-token
          secret:
            defaultMode: 420
            items:
              - key: CF_API_TOKEN
                path: token
            optional: true
            secretName: stalwart-cloudflare-phonaid-token
        - name: cloudflare-re8ch-token
          secret:
            defaultMode: 420
            items:
              - key: CF_API_TOKEN
                path: token
            optional: true
            secretName: stalwart-cloudflare-dns-token
        - name: oidc-keys
          secret:
            defaultMode: 420
            secretName: stalwart-idp-oidc-keys
        - name: metrics-auth
          secret:
            defaultMode: 420
            optional: true
            secretName: stalwart-metrics-auth
  updateStrategy:
    type: RollingUpdate
