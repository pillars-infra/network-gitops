apiVersion: peering.re8ch.com/v1alpha1
kind: ManagedAccessGrant
metadata:
  name: re8ch-atlantic-networking-mail-system
  namespace: byoc-pilot
  labels: {app.kubernetes.io/part-of: among-clusters}
spec:
  advertisementRef: re8ch-atlantic-default-kubernetes
  peerRef: re8ch-atlantic
  approved: true
  revoked: false
  expiresAt: '2027-11-24T23:59:59Z'
  scope: Namespaced
  namespaces: [mail-system]
  rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [ssa-state-agent-runtime-exact-atlantic-stalwart-token-trust, ssa-state-agent-runtime-stalwart-token-trust-run, ssa-state-networking-native-atlantic-mail-system, stalwart-config, stalwart-idp-config]
    verbs: [get, patch, update, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [stalwart-tls-reloader]
    verbs: [get, patch, update, delete]
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [stalwart-token-trust-apply-v1]
    verbs: [get, create, patch, update, delete]
  - apiGroups: ['']
    resources: [services]
    resourceNames: [stalwart, stalwart-direct-mail, stalwart-headless, stalwart-idp, stalwart-webmail]
    verbs: [get, patch, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [stalwart-webmail]
    verbs: [get, patch, update, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [stalwart-flk, stalwart-idp-flk]
    verbs: [get, patch, update, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    resourceNames: [stalwart-mail-re8ch]
    verbs: [get, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: networking-atlantic-mail-grant-use, namespace: byoc-pilot}
rules:
- apiGroups: [peering.re8ch.com]
  resources: [managedaccessgrants]
  resourceNames: [re8ch-atlantic-networking-mail-system]
  verbs: [get, use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: networking-atlantic-mail-grant-use, namespace: byoc-pilot}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: networking-atlantic-mail-grant-use}
subjects:
- {kind: Group, name: 're8ch:release-executor:networking', apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: agent-runtime-atlantic-mail-grant-use, namespace: byoc-pilot}
rules:
- apiGroups: [peering.re8ch.com]
  resources: [managedaccessgrants]
  resourceNames: [re8ch-atlantic-networking-mail-system]
  verbs: [get, use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: agent-runtime-atlantic-mail-grant-use, namespace: byoc-pilot}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent-runtime-atlantic-mail-grant-use}
subjects:
- {kind: Group, name: 're8ch:release-executor:agent-runtime', apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: re8ch-cloud-platform-atlantic-mail-grant-metadata, namespace: byoc-pilot}
rules:
- apiGroups: [peering.re8ch.com]
  resources: [managedaccessgrants]
  resourceNames: [re8ch-atlantic-networking-mail-system]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: re8ch-cloud-platform-atlantic-mail-grant-metadata, namespace: byoc-pilot}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: re8ch-cloud-platform-atlantic-mail-grant-metadata}
subjects:
- {kind: ServiceAccount, name: re8ch-cloud-platform, namespace: ai-operations}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: networking-cloud-platform-exact-proxy, namespace: ai-operations}
rules:
- apiGroups: ['']
  resources: [services/proxy]
  resourceNames: ['re8ch-cloud-platform:19443']
  verbs: [get, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: networking-cloud-platform-exact-proxy, namespace: ai-operations}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: networking-cloud-platform-exact-proxy}
subjects:
- {kind: Group, name: 're8ch:release-executor:networking', apiGroup: rbac.authorization.k8s.io}
