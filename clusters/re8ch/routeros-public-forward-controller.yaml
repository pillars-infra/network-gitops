  observe.py: |
    #!/usr/bin/env python3
    """Read-only, destination-scoped RouterOS diagnostics through the existing owner."""
    import argparse
    import ipaddress
    import json
    from urllib.parse import urlencode

    SOURCES = ipaddress.ip_network('10.68.9.0/24')
    DESTINATIONS = {'101.34.217.95', '124.220.77.50', '1.14.174.244'}
    NAT_FIELDS = ('chain', 'action', 'src-address', 'dst-address', 'protocol', 'dst-port',
                  'to-addresses', 'to-ports', 'in-interface', 'out-interface', 'disabled')
    ROUTE_FIELDS = ('dst-address', 'gateway', 'active', 'routing-table', 'distance', 'dynamic')
    CONNECTION_FIELDS = ('src-address', 'dst-address', 'reply-src-address', 'reply-dst-address',
                         'protocol', 'srcnat', 'dstnat', 'seen-reply', 'assured')


    def validate(source, destination, source_port):
        source = str(ipaddress.IPv4Address(source))
        destination = str(ipaddress.IPv4Address(destination))
        if ipaddress.ip_address(source) not in SOURCES or destination not in DESTINATIONS:
            raise ValueError('diagnostic scope is not reviewed')
        if not 1024 <= source_port <= 65535:
            raise ValueError('invalid diagnostic source port')
        return source, destination


    def projected(row, fields):
        # Only printable bounded scalar fields, never comments, auth or arbitrary response keys.
        return {key: str(row[key]) for key in fields if key in row and
                isinstance(row[key], (str, bool, int)) and len(str(row[key])) <= 160 and
                all(32 <= ord(char) < 127 for char in str(row[key]))}


    def get_rows(router, path, fields, filters=None):
        query = {'.proplist': ','.join(fields)}
        query.update(filters or {})
        rows = router.request(path + '?' + urlencode(query), method='GET')
        if not isinstance(rows, list) or any(not isinstance(row, dict) for row in rows):
            raise ValueError('unexpected RouterOS response shape')
        return rows


    def covers(value, address):
        if not value:
            return True
        try:
            return ipaddress.ip_address(address) in ipaddress.ip_network(value, strict=False)
        except ValueError:
            return None


    def port_covers(value, port):
        if not value:
            return True
        try:
            for part in value.split(','):
                bounds = [int(item) for item in part.split('-')]
                if len(bounds) == 1 and bounds[0] == port:
                    return True
                if len(bounds) == 2 and bounds[0] <= port <= bounds[1]:
                    return True
            return False
        except (ValueError, AttributeError):
            return None


    def observe(router, source, destination, source_port):
        source, destination = validate(source, destination, source_port)
        routes = get_rows(router, '/ip/route', ROUTE_FIELDS)
        relevant_routes = []
        for row in routes:
            if covers(row.get('dst-address'), source) is True:
                relevant_routes.append(projected(row, ROUTE_FIELDS))
        nat = get_rows(router, '/ip/firewall/nat', NAT_FIELDS)
        relevant_nat = []
        unknown_selectors = 0
        for row in nat:
            if str(row.get('disabled', 'false')).lower() == 'true':
                continue
            if row.get('protocol') not in (None, '', 'udp', 'tcp'):
                continue
            # Report possible matching rules in original order. Unknown/range/inverted
            # selectors remain candidates, not proof that a particular rule matched.
            match = [covers(row.get('src-address'), source), covers(row.get('dst-address'), destination),
                     port_covers(row.get('dst-port'), 53)]
            reverse = [covers(row.get('src-address'), destination), covers(row.get('dst-address'), source),
                       port_covers(row.get('dst-port'), source_port)]
            if False in match and False in reverse:
                continue
            unknown_selectors += int(None in match or None in reverse)
            relevant_nat.append(projected(row, NAT_FIELDS))
        filters = {'src-address': source + ':' + str(source_port), 'dst-address': destination + ':53',
                   'protocol': 'udp'}
        connections = get_rows(router, '/ip/firewall/connection', CONNECTION_FIELDS, filters)
        # Verify exact scope again even if the provider ignores URL filters. Never
        # output an unrelated connection or treat an absent/expired entry as success.
        selected = [projected(row, CONNECTION_FIELDS) for row in connections
                    if all(str(row.get(key, '')) == value for key, value in filters.items())]
        return {'definition': 'routeros-public-dns-return-v1', 'source': source,
                'destination': destination, 'sourcePort': source_port, 'destinationPort': 53,
                'routesCoveringSource': relevant_routes, 'possibleNatRulesInOrder': relevant_nat,
                'unknownNatSelectors': unknown_selectors, 'exactUdpConnections': selected,
                'connectionObservation': 'present' if selected else 'absent-or-expired',
                'claim': 'read-only snapshot; rule candidates are not packet-hit proof'}


    def main(argv=None):
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument('--source-address', required=True)
        parser.add_argument('--destination-address', required=True)
        parser.add_argument('--source-port', required=True, type=int)
        args = parser.parse_args(argv)
        source, destination = validate(args.source_address, args.destination_address, args.source_port)
        # Import is safe: reviewed owner has a guarded __main__. Reuse its mounted
        # credential reference and HTTP adapter; never print/read credentials here.
        from reconcile import Router
        try:
            result = observe(Router('192.168.88.1'), source, destination, args.source_port)
        except Exception as error:
            print(json.dumps({'state': 'failed', 'errorType': type(error).__name__}))
            return 1
        print(json.dumps(result, sort_keys=True))
        return 0


    if __name__ == '__main__':
        raise SystemExit(main())
  pod_return_policy.py: |
    """Bounded pool-family admission for the existing R640 RouterOS peer."""
    import ipaddress
    import re
    from urllib.parse import urlencode

    OWNER = 'RE8CH GITOPS R640 POD RETURN'
    CHAIN = 're8ch-v2-r640-in'
    TABLE = 're8ch-service-fast'
    PEER = '192.168.88.251'
    ASN = '4200000128'
    LOCAL = '192.168.88.1'
    NATIVE = ipaddress.ip_network('10.64.0.0/12')
    # Retain failed refreshes in-process; startup refresh covers interrupted writes.
    _refresh_pending = True


    def validate_policy(policy):
        if not policy:
            return []
        if (policy.get('peerAddress') != PEER or str(policy.get('peerASN')) != ASN or
                policy.get('localAddress') != LOCAL or policy.get('filterChain') != CHAIN or
                policy.get('routingTable') != TABLE or policy.get('commentPrefix') != OWNER):
            raise ValueError('Pod-return authority differs')
        refs = policy.get('poolRefs', [])
        pools = policy.get('approvedPools', [])
        if not refs or len(set(refs)) != len(refs) or not pools:
            raise ValueError('reviewed pool projection is required')
        networks, seen = [], set()
        for pool in pools:
            network = ipaddress.ip_network(pool['cidr'], strict=True)
            if (pool.get('poolRef') not in refs or pool.get('maskSize') != 24 or
                    network.version != 4 or not network.subnet_of(NATIVE) or network.prefixlen > 24 or
                    any(network.overlaps(prior) for prior in networks)):
                raise ValueError('Pod-return pool projection differs')
            networks.append(network)
            seen.add(pool['poolRef'])
        if seen != set(refs):
            raise ValueError('incomplete pool projection')
        return sorted(str(network) for network in networks)


    def identity(value):
        if not isinstance(value, str) or not re.fullmatch(r'\*[0-9a-fA-F]+', value):
            raise ValueError('exact RouterOS object identity is required')
        return value


    def enabled(row):
        return str(row.get('disabled', 'false')).lower() not in {'true', 'yes'}


    def peer_matches(row):
        return (str(row.get('remote.address', '')).split('/')[0] == PEER and
                str(row.get('remote.as')) == ASN and row.get('local.address') == LOCAL)


    def rows(router, path):
        fields = {
            '/routing/bgp/connection': ('.id','name','remote.address','remote.as','local.address','input.filter','routing-table','disabled'),
            '/routing/table': ('.id','name','fib','disabled'),
            '/routing/filter/rule': ('.id','chain','rule','comment','disabled'),
            '/routing/rule': ('.id','dst-address','src-address','interface','routing-mark','action','table','comment','disabled'),
            '/routing/bgp/session': ('.id','name','remote.address','remote.as','local.address','established','remote.afi','local.afi','remote.capabilities'),
        }[path]
        result = router.request(path + '?' + urlencode({'.proplist': ','.join(fields)}))
        if not isinstance(result, list) or any(not isinstance(row, dict) for row in result):
            raise ValueError('unexpected RouterOS observation shape')
        return [{key: value for key, value in row.items() if key in fields} for row in result]


    def plan_pod_return(router, policy):
        aggregates = validate_policy(policy)
        if not policy:
            return {'actions': [], 'refresh': None}
        connections = rows(router, '/routing/bgp/connection')
        active = [row for row in connections if enabled(row) and row.get('input.filter') == CHAIN]
        if len(active) != 1 or not peer_matches(active[0]) or active[0].get('routing-table') != TABLE:
            raise ValueError('dedicated R640 peer differs')
        tables = rows(router, '/routing/table')
        if len([row for row in tables if row.get('name') == TABLE]) != 1:
            raise ValueError('existing routing table differs')
        filters = rows(router, '/routing/filter/rule')
        routes = rows(router, '/routing/rule')
        rejects = [row for row in filters if row.get('chain') == CHAIN and enabled(row) and row.get('rule', '').strip() == 'reject']
        anchors = [row for row in routes if enabled(row) and row.get('dst-address') == '10.42.0.0/16'
                   and row.get('action') == 'lookup' and row.get('table') == TABLE
                   and not any(row.get(key) for key in ('src-address','interface','routing-mark'))]
        if len(rejects) != 1 or len(anchors) != 1:
            raise ValueError('existing admission or routing anchor differs')
        # Existing legacy/VIP rules stay untouched. Reject a different chain sharing
        # our namespace rather than moving, taking over or deleting foreign rules.
        for row in filters:
            if str(row.get('comment') or '').startswith(OWNER + ' ') and row.get('chain') != CHAIN:
                raise ValueError('filter ownership conflict')
        for row in routes:
            if str(row.get('comment') or '').startswith(OWNER + ' ') and row.get('table') != TABLE:
                raise ValueError('routing-rule ownership conflict')
        actions = []
        import_changed = False
        for path, observed, anchor, mode in [
                ('/routing/filter/rule', filters, rejects[0], 'import'),
                ('/routing/rule', routes, anchors[0], 'lookup')]:
            desired = []
            for aggregate in aggregates:
                comment = OWNER + ' ' + mode + ' ' + aggregate
                if mode == 'import':
                    body = {'chain': CHAIN, 'rule': 'if (dst in ' + aggregate + ' && dst-len == 24) { accept }',
                            'comment': comment, 'disabled': 'false'}
                else:
                    body = {'dst-address': aggregate, 'action': 'lookup', 'table': TABLE,
                            'comment': comment, 'disabled': 'false'}
                desired.append(comment)
                prior = [row for row in observed if row.get('comment') == comment]
                if len(prior) > 1:
                    raise ValueError('duplicate owned policy rule')
                if not prior:
                    actions.append(('create', path, None, body, identity(anchor['.id'])))
                    import_changed |= mode == 'import'
                else:
                    row = prior[0]
                    if any(str(row.get(key, 'false' if key == 'disabled' else '')) != value for key, value in body.items()):
                        actions.append(('patch', path, identity(row['.id']), body, None))
                        import_changed |= mode == 'import'
                    if observed.index(row) > observed.index(anchor):
                        actions.append(('move', path, identity(row['.id']), None, identity(anchor['.id'])))
                        import_changed |= mode == 'import'
            for row in observed:
                if str(row.get('comment') or '').startswith(OWNER + ' ' + mode + ' ') and row['comment'] not in desired:
                    actions.append(('delete', path, identity(row['.id']), None, None))
                    import_changed |= mode == 'import'
        refresh = None
        if import_changed or _refresh_pending:
            sessions = rows(router, '/routing/bgp/session')
            selected = [row for row in sessions if peer_matches(row) and
                        str(row.get('established', '')).lower() == 'true' and
                        row.get('remote.afi') == 'ip' and row.get('local.afi') == 'ip' and
                        'rr' in str(row.get('remote.capabilities', '')).split(',')]
            if len(selected) != 1 or not selected[0].get('.id'):
                raise ValueError('fresh exact route-refresh session is unavailable')
            refresh = identity(selected[0]['.id'])
        return {'actions': actions, 'refresh': refresh}


    def apply_pod_return(router, plan):
        global _refresh_pending
        if plan['refresh']:
            _refresh_pending = True
        for action, path, row_id, body, anchor in plan['actions']:
            if action == 'create':
                row = router.request(path, 'PUT', body)
                if not isinstance(row, dict) or not row.get('.id'):
                    raise ValueError('created policy identity is unavailable')
                router.request(path + '/move', 'POST', {'numbers': identity(row['.id']), 'destination': identity(anchor)})
            elif action == 'patch':
                router.request(path + '/' + identity(row_id), 'PATCH', body)
            elif action == 'move':
                router.request(path + '/move', 'POST', {'numbers': identity(row_id), 'destination': identity(anchor)})
            elif action == 'delete':
                router.request(path + '/' + identity(row_id), 'DELETE')
            else:
                raise ValueError('unknown policy action')
        if plan['refresh']:
            # This RouterOS accepts numbers-only refresh; the plan requires both
            # negotiated AFIs to be exactly IPv4, never a broader-family fallback.
            # Soft refresh is limited to the currently observed exact peer/session.
            # No reset, disable, reconnect, all-peer operation or business replay.
            router.request('/routing/bgp/session/refresh', 'POST', {'numbers': identity(plan['refresh'])})
            _refresh_pending = False
        return len(plan['actions'])
  reconcile.py: |
    #!/usr/bin/env python3
    """Reconcile explicitly owned public RouterOS forwards before the fallback rule."""
    import base64
    import ipaddress
    import json
    from pathlib import Path
    import time
    import urllib.request
    from pod_return_policy import plan_pod_return, apply_pod_return


    def validate(spec):
        if spec["managementIp"] != "192.168.88.1":
            raise ValueError("RouterOS management authority differs")
        if spec["publicEndpoint"] != "223.159.210.222":
            raise ValueError("public endpoint authority differs")
        if spec["gatewayVip"] != "10.251.0.4":
            raise ValueError("Gateway VIP authority differs")
        if spec["anchorComment"] != "RE8CH default WAN TCP same-port DNAT to R640":
            raise ValueError("fallback anchor differs")
        if spec["returnAnchorComment"] != "defconf: masquerade after symmetric rules":
            raise ValueError("return anchor differs")
        if spec["commentPrefix"] != "RE8CH GITOPS PUBLIC FORWARD":
            raise ValueError("ownership prefix differs")
        if spec["outerSniBackend"] != "192.168.88.251" or spec["outerSniPort"] != "10443":
            raise ValueError("outer SNI authority differs")
        if spec["outerSniRules"] != [
            "RE8CH priority public web direct to Cilium Loudi Gateway VIP",
            "RE8CH public web LAN VPN hairpin to Cilium Loudi VIP",
        ]:
            raise ValueError("outer SNI rule ownership differs")
        if spec["forwards"] != [{"protocol": "tcp", "port": "6443", "toPort": "6443"}]:
            raise ValueError("unexpected public forwards")
        ipaddress.ip_address(spec["managementIp"])
        ipaddress.ip_address(spec["publicEndpoint"])
        ipaddress.ip_address(spec["gatewayVip"])
        ipaddress.ip_address(spec["outerSniBackend"])


    class Router:
        def __init__(self, address):
            user = Path("/credential/username").read_bytes().strip()
            password = Path("/credential/password").read_bytes()
            auth = base64.b64encode(user + b":" + password).decode()
            self.base = "http://" + address + "/rest"
            self.headers = {"Authorization": "Basic " + auth, "Content-Type": "application/json"}
            self.opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))

        def request(self, path, method="GET", body=None):
            request = urllib.request.Request(
                self.base + path,
                method=method,
                headers=self.headers,
                data=json.dumps(body).encode() if body is not None else None,
            )
            with self.opener.open(request, timeout=10) as response:
                raw = response.read()
            return json.loads(raw) if raw else {}


    def reconcile(router, spec):
        validate(spec)
        pod_return_plan = plan_pod_return(router, spec.get("podReturnPolicy"))
        rows = router.request("/ip/firewall/nat")
        anchors = [row for row in rows if row.get("comment") == spec["anchorComment"]]
        if len(anchors) != 1:
            raise ValueError("fallback anchor missing or ambiguous")
        anchor = anchors[0]
        return_anchors = [row for row in rows if row.get("comment") == spec["returnAnchorComment"]]
        if len(return_anchors) != 1:
            raise ValueError("return anchor missing or ambiguous")
        return_anchor = return_anchors[0]
        wanted = set()
        changes = 0
        for comment in spec["outerSniRules"]:
            prior = [row for row in rows if row.get("comment") == comment]
            if len(prior) != 1:
                raise ValueError("outer SNI rule missing or ambiguous")
            row = prior[0]
            expected = {
                "chain": "dstnat",
                "protocol": "tcp",
                "dst-port": "80,443",
                "dst-address": spec["publicEndpoint"],
                "action": "dst-nat",
                "to-addresses": spec["outerSniBackend"],
                "to-ports": spec["outerSniPort"],
            }
            if any(row.get(key) != value for key, value in expected.items()):
                router.request("/ip/firewall/nat/" + row[".id"], "PATCH", expected)
                changes += 1
        for forward in spec["forwards"]:
            comment = f'{spec["commentPrefix"]} {forward["protocol"]} {forward["port"]}'
            wanted.add(comment)
            body = {
                "comment": comment,
                "chain": "dstnat",
                "protocol": forward["protocol"],
                "dst-port": forward["port"],
                "dst-address": spec["publicEndpoint"],
                "action": "dst-nat",
                "to-addresses": spec["gatewayVip"],
                "to-ports": forward["toPort"],
                "disabled": "false",
            }
            prior = [row for row in rows if row.get("comment") == comment]
            if len(prior) > 1:
                raise ValueError("duplicate owned public forward")
            if prior:
                row = prior[0]
                if any(row.get(key) != value for key, value in body.items()):
                    router.request("/ip/firewall/nat/" + row[".id"], "PATCH", body)
                    changes += 1
            else:
                row = router.request("/ip/firewall/nat", "PUT", body)
                changes += 1
            router.request(
                "/ip/firewall/nat/move",
                "POST",
                {"numbers": row[".id"], "destination": anchor[".id"]},
            )
            return_comment = f'{spec["commentPrefix"]} RETURN {forward["protocol"]} {forward["port"]}'
            wanted.add(return_comment)
            return_body = {
                "comment": return_comment,
                "chain": "srcnat",
                "protocol": forward["protocol"],
                "dst-port": forward["toPort"],
                "dst-address": spec["gatewayVip"],
                "action": "masquerade",
                "disabled": "false",
            }
            return_prior = [row for row in rows if row.get("comment") == return_comment]
            if len(return_prior) > 1:
                raise ValueError("duplicate owned public return rule")
            if return_prior:
                return_row = return_prior[0]
                if any(return_row.get(key) != value for key, value in return_body.items()):
                    router.request("/ip/firewall/nat/" + return_row[".id"], "PATCH", return_body)
                    changes += 1
            else:
                return_row = router.request("/ip/firewall/nat", "PUT", return_body)
                changes += 1
            router.request(
                "/ip/firewall/nat/move",
                "POST",
                {"numbers": return_row[".id"], "destination": return_anchor[".id"]},
            )
        for row in rows:
            comment = row.get("comment", "")
            if comment.startswith(spec["commentPrefix"] + " ") and comment not in wanted:
                router.request("/ip/firewall/nat/" + row[".id"], "DELETE")
                changes += 1
        pod_return_changes = apply_pod_return(router, pod_return_plan)
        if pod_return_changes and plan_pod_return(router, spec.get("podReturnPolicy"))["actions"]:
            raise ValueError("Pod-return policy readback differs")
        return {"changes": changes, "forwards": len(spec["forwards"]),
                "podReturnChanges": pod_return_changes}


    def main():
        while True:
            try:
                spec = json.loads(Path("/config/desired.json").read_text())
                result = reconcile(Router(spec["managementIp"]), spec)
                Path("/tmp/routeros-public-forward-ready").touch()
                print(json.dumps({"state": "reconciled", **result}), flush=True)
            except Exception as exc:
                Path("/tmp/routeros-public-forward-ready").unlink(missing_ok=True)
                print(json.dumps({"state": "failed", "errorType": type(exc).__name__}), flush=True)
            time.sleep(30)


    if __name__ == "__main__":
        main()

