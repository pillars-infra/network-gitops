apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeros-public-forward-controller
  namespace: ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routeros-public-forward-controller
  template:
    metadata:
      annotations:
        networking.re8ch.com/config-revision: outer-sni-v1
        networking.re8ch.com/return-policy-code-sha256: 024bf4ef9ddc2bef6ec4d3158b06f99340474d98b63a673cda5bc42655740f59
      labels:
        app.kubernetes.io/name: routeros-public-forward-controller
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconciler
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: ["python3", "/config/reconcile.py"]
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - import pathlib,time; assert time.time()-pathlib.Path('/tmp/routeros-public-forward-ready').stat().st_mtime < 90
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: credential
              mountPath: /credential
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: routeros-public-forward-controller
        - name: credential
          secret:
            secretName: mikrotik-routeros-admin
        - name: tmp
          emptyDir: {}
