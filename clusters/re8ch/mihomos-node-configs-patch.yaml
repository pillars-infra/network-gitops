# Source: mihomos-cluster/templates/dataplane.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: mihomos-node-configs, namespace: egress-fabric}
data:
  cn.yaml: |
    mixed-port: 17891
    external-controller: 0.0.0.0:19090
    allow-lan: true
    mode: rule
    rule-providers:
      cn-ip: {type: file, behavior: classical, path: /etc/mihomo/rules/cn-ip-rules.yaml}
    proxies:
      # The LA nodes moved to re8ch-atlantic.  Consume their exported Service
      # through AmongCluster instead of probing the now-empty main-cluster
      # per-node Service.
      - {name: ATLANTIC, type: socks5, server: mihomos-global-exit-atlantic.egress-fabric.svc.cluster.local, port: 1080}
      - {name: OVERSEAS-FLK, type: socks5, server: mihomos-global-exit-overseas-flk.egress-fabric.svc.cluster.local, port: 1080}
    proxy-groups:
      - name: GLOBAL
        type: fallback
        proxies: [ATLANTIC, OVERSEAS-FLK]
        url: "https://www.gstatic.com/generate_204"
        interval: 600
        lazy: true
    rules: ["IP-CIDR,10.0.0.0/8,DIRECT,no-resolve", "IP-CIDR,100.64.0.0/10,DIRECT,no-resolve", "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve", "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve", "DOMAIN,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,ghcr.io,GLOBAL", "DOMAIN-SUFFIX,pkg-containers.githubusercontent.com,GLOBAL", "DOMAIN-SUFFIX,github.com,GLOBAL", "DOMAIN-SUFFIX,githubusercontent.com,GLOBAL", "DOMAIN-SUFFIX,cn,DIRECT", "RULE-SET,cn-ip,DIRECT", "MATCH,GLOBAL"]
  global.yaml: |
    mixed-port: 17891
    external-controller: 0.0.0.0:19090
    allow-lan: true
    mode: rule
    ipv6: false
    dns:
      enable: true
      ipv6: false
      enhanced-mode: redir-host
      default-nameserver: [1.1.1.1, 8.8.8.8]
      nameserver:
        - https://1.1.1.1/dns-query#DIRECT
        - https://dns.google/dns-query#DIRECT
      nameserver-policy:
        "+.cn": [https://dns.alidns.com/dns-query#DIRECT, https://doh.pub/dns-query#DIRECT]
    rule-providers:
      cn-ip: {type: file, behavior: classical, path: /etc/mihomo/rules/cn-ip-rules.yaml}
    proxies:
      - {name: CN-FABRIC, type: socks5, server: mihomos-cn-exit.egress-fabric.svc.cluster.local, port: 1080}
    proxy-groups:
      - name: CN
        type: fallback
        proxies: [CN-FABRIC]
        url: "https://connect.rom.miui.com/generate_204"
        interval: 600
        lazy: true
    rules: ["IP-CIDR,10.0.0.0/8,DIRECT,no-resolve", "IP-CIDR,100.64.0.0/10,DIRECT,no-resolve", "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve", "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve", "DOMAIN,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,cn,CN", "RULE-SET,cn-ip,CN", "MATCH,DIRECT"]
  exit.yaml: |
    mixed-port: 1080
    external-controller: 127.0.0.1:19091
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: direct
    rules: ["MATCH,DIRECT"]
