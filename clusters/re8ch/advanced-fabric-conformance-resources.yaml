- op: add
  path: /spec/postRenderers/0/kustomize/patches/-
  value:
    target:
      group: apps
      version: v1
      kind: DaemonSet
      name: advanced-fabric-agent
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: advanced-fabric-agent
      spec:
        template:
          spec:
            containers:
              - name: host-conformance
                resources:
                  requests: {cpu: 100m, memory: 64Mi}
                  limits: {cpu: "2", memory: 256Mi}
- op: add
  path: /spec/postRenderers/0/kustomize/patches/-
  value:
    target:
      group: apps
      version: v1
      kind: DaemonSet
      name: advanced-fabric-pod-conformance
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: advanced-fabric-pod-conformance
      spec:
        template:
          spec:
            containers:
              - name: pod-conformance
                resources:
                  requests: {cpu: 100m, memory: 64Mi}
                  limits: {cpu: "2", memory: 256Mi}
