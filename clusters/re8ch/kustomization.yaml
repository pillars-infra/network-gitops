apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cilium-release.yaml
  - r640-cilium-datapath.yaml
  - resources.yaml
  - kube-api-public.yaml
  - kube-api-observer-proxy.yaml
  - kube-api-overseas-relay.yaml
  - kube-api-overseas-relay-upstream.enc.yaml
  - routeros-public-forward-controller.yaml
  - regional-origin-dnat-r640-exclusion.yaml
  - r640-outer-sni-dnat.yaml
  - multi-pool
  - mihomos-authority-resources.yaml
  - among-clusters-atlantic-peer.yaml
  - among-clusters-cloud-broker-access.yaml
  - among-clusters-atlantic-release-canary.yaml
patches:
  - path: public-edge-authority-rollout.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      namespace: flux-network-system
      name: public-edge-manager
  - path: advanced-fabric-allocation-observation.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      namespace: flux-network-system
      name: advanced-fabric
  - path: advanced-fabric-control-plane-offload.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      namespace: flux-network-system
      name: advanced-fabric
  - path: mihomos-node-configs-patch.yaml
    target:
      version: v1
      kind: ConfigMap
      namespace: egress-fabric
      name: mihomos-node-configs
  - path: mihomos-node-cn-patch.yaml
    target:
      group: apps
      version: v1
      kind: DaemonSet
      namespace: egress-fabric
      name: mihomos-node-cn
  - path: routeros-transit-control-plane-offload.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      namespace: ops
      name: routeros-transit-controller
  - path: external-dns-control-api.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      namespace: qianwen-ops
      name: external-dns-cloudflare
  - path: among-clusters-public-authority.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      namespace: flux-network-system
      name: among-clusters-agent
  - path: among-clusters-hub-loopback.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      namespace: flux-network-system
      name: among-clusters-hub
  - path: among-clusters-atlantic-mail-imports.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      namespace: flux-network-system
      name: among-clusters-agent
