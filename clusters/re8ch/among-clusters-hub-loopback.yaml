apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: among-clusters-hub
  namespace: flux-network-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: among-clusters-hub
            patch: |-
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: add
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
              - op: add
                path: /spec/template/spec/containers/0/ports/0/hostPort
                value: 8080

              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/among-clusters/among-clusters@sha256:e4318df4f9f6cc47c391c20f178c4b8000627c69c09cc48364630c4a68853d45
