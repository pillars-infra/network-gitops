apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: among-clusters-hub
  namespace: flux-network-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: among-clusters-hub
            patch: |-
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: add
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
              - op: add
                path: /spec/template/spec/containers/0/ports/0/hostPort
                value: 8080

              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/among-clusters/among-clusters@sha256:dfec9b42b6f9ebcb67228b5c50fff83c75069da8da40ae9ffd88c8990cfd70c7
