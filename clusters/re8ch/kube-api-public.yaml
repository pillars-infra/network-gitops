apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: kube-api-service
  namespace: kube-system
  labels:
    operations.re8ch.com/credential-contract: node-observer
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      sectionName: kube-api-service-tls
  hostnames:
    - kube-api.service.re8ch.com
  rules:
    - backendRefs:
        - name: kube-api-observer-proxy
          port: 6443
