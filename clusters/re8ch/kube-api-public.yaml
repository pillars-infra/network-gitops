apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: kube-api-public
  namespace: kube-system
  labels:
    operations.re8ch.com/credential-contract: node-observer
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      sectionName: kube-api
  rules:
    - backendRefs:
        - name: kube-api-observer-proxy
          port: 6443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kube-api-service
  namespace: kube-system
  labels:
    operations.re8ch.com/credential-contract: node-observer
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      sectionName: service-wildcard-https
  hostnames:
    - kube-api.service.re8ch.com
  rules:
    - backendRefs:
        - name: kube-api-observer-proxy
          port: 6443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: kube-api-observer-proxy
  namespace: kube-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kube-api-observer-proxy
      sectionName: kube-api
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
    hostname: k3s-api.internal.re8ch.com
