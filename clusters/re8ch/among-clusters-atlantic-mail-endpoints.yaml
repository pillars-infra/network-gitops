apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: stalwart-atlantic-management
  namespace: mail-system
  labels:
    kubernetes.io/service-name: stalwart
    endpointslice.kubernetes.io/managed-by: network-gitops.re8ch.com
addressType: IPv4
ports:
  - name: management
    protocol: TCP
    port: 18083
endpoints:
  - addresses: [10.250.0.128]
    conditions: {ready: true, serving: true, terminating: false}
    nodeName: r640
---
