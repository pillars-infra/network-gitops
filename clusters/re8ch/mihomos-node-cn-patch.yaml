# Source: mihomos-cluster/templates/dataplane.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: mihomos-node-cn, namespace: egress-fabric}
spec:
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: mihomos-node-cn}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mihomos-node-cn, app.kubernetes.io/component: node-proxy}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {networking.re8ch.com/geo: cn}
      tolerations: [{operator: Exists}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mihomo
          image: docker.io/metacubex/mihomo:v1.19.29@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
          imagePullPolicy: IfNotPresent
          args: [-d, /etc/mihomo]
          ports: [{name: mixed, containerPort: 17891}, {name: controller, containerPort: 19090}]
          readinessProbe: {httpGet: {path: /version, port: controller}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/mihomo/config.yaml, subPath: cn.yaml, readOnly: true}
            - {name: cn-rules, mountPath: /etc/mihomo/rules, readOnly: true}
      volumes:
        - {name: config, configMap: {name: mihomos-node-configs}}
        - {name: cn-rules, configMap: {name: mihomos-cn-ip-rules}}
