apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: among-clusters-agent
  namespace: flux-network-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: among-clusters-agent
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env/3/value
                value: http://among-clusters-hub.among-clusters.svc.cluster.local
              - op: remove
                path: /spec/template/spec/hostAliases
  values:
    # Keep TLS/SNI while resolving the co-located hub through the declared
    # internal Cilium Gateway VIP, never through external PublicEdge DNS.
    hubEndpoint: https://among-clusters.service.re8ch.com
    hostAliases:
      - ip: 10.251.0.4
        hostnames: [among-clusters.service.re8ch.com]
    gateway:
      publicAuthority:
        requiredForwardPorts:
          - 25
          - 53
          - 80
          - 443
          - 465
          - 587
          - 993
          - 4190
          - 6443
