apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: among-clusters-agent
  namespace: flux-network-system
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: among-clusters-agent
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env/3/value
                value: http://127.0.0.1:8080
              - op: remove
                path: /spec/template/spec/hostAliases
              # The provider agent is part of the recovery path for the
              # service network itself.  Reach the node-local API frontend so
              # a broken ClusterIP dataplane cannot prevent it from loading
              # its identity and re-establishing Atlantic peer sessions.
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: add
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: KUBERNETES_SERVICE_HOST, value: 127.0.0.1}
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: KUBERNETES_SERVICE_PORT, value: "6443"}
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: among-clusters-gateway
            # Keep the recovery plane independent of cluster DNS. Kube API uses
            # its immutable Service IP. PublicEdge deliberately enters through
            # the declared active Gateway VIP so Cilium classifies the source
            # as ingress; using the ClusterIP bypasses that identity boundary
            # and every ingress-only backend returns Access denied.
            patch: |-
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: add
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
              # Keep the other host listeners implicit. Reserve only the
              # dedicated Atlantic bridge, distinct from the CN SOCKS exit.
              - op: replace
                path: /spec/template/spec/containers/0/ports
                value:
                  - {name: atl-exit, containerPort: 31080, protocol: TCP}
              - op: replace
                path: /spec/template/spec/containers/0/env/2/value
                value: '[{"serviceIdentity":"spiffe://re8ch.internal/ns/kube-system/service/kubernetes-api","target":"10.43.0.1:443","targetPeers":["re8ch-atlantic"]},{"serviceIdentity":"spiffe://re8ch.internal/ns/kube-system/service/public-edge-tls","target":"10.251.0.4:443","targetPeers":["re8ch-atlantic"]}]'
          - target:
              version: v1
              kind: Service
              name: among-clusters-gateway
            patch: |-
              - op: replace
                path: /spec/ports/0/targetPort
                value: 8443
              - op: replace
                path: /spec/ports/1/targetPort
                value: 22240
              - op: replace
                path: /spec/ports/2/targetPort
                value: 23768
              - op: replace
                path: /spec/ports/3/targetPort
                value: 33768
              - op: test
                path: /spec/ports/4/name
                value: atl-exit
              - op: replace
                path: /spec/ports/4/targetPort
                value: 31080
              - op: replace
                path: /spec/ports/5/targetPort
                value: 18080
              - op: replace
                path: /spec/ports/6/targetPort
                value: 18081
              - op: replace
                path: /spec/ports/7/targetPort
                value: 18083
          - target:
              group: networking.k8s.io
              version: v1
              kind: NetworkPolicy
              name: among-clusters-gateway
            patch: |-
              - op: add
                path: /spec/ingress/-
                value:
                  from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: egress-fabric
                  ports:
                    - {protocol: TCP, port: 31080}
  values:
    # The post-rendered workload talks directly to the co-located hub Service;
    # this chart value remains only as the stable upstream chart input.
    hubEndpoint: https://among-clusters.service.re8ch.com
    hostAliases:
      - ip: 10.251.0.4
        hostnames: [among-clusters.service.re8ch.com]
    gateway:
      publicAuthority:
        requiredForwardPorts:
          - 25
          - 53
          - 80
          - 443
          - 465
          - 587
          - 993
          - 4190
          - 6443
