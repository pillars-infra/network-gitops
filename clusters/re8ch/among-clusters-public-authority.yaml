apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: among-clusters-agent
  namespace: flux-network-system
spec:
  values:
    # Preserve the public TLS name while resolving it to the Cilium Gateway
    # Service ClusterIP from inside the provider cluster. This keeps the
    # request on the cluster network without weakening HTTPS/SNI verification.
    hostAliases:
      - ip: 10.43.158.127
        hostnames: [among-clusters.service.re8ch.com]
    gateway:
      publicAuthority:
        requiredForwardPorts:
          - 25
          - 53
          - 80
          - 443
          - 465
          - 587
          - 993
          - 4190
          - 6443
