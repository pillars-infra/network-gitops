name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","r640","untrusted-build"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v4.2.3}
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23' 'pytest>=8'
      - run: kubectl kustomize clusters/re8ch >/dev/null
      - run: python3 policies/validate.py
      - run: python3 operations/releases/compile_native.py --check
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/charts
          key: network-charts-${{ runner.os }}-${{ hashFiles('operations/releases/helm-lock.json') }}
      - run: python3 operations/releases/compile_helm.py --check
      - run: python3 -m pytest -q
