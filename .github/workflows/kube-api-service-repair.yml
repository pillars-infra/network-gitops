name: kube-api-service-repair
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  repair:
    runs-on: ubuntu-24.04
    environment: release-executor-networking
    permissions: {contents: read, id-token: write}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2'
      - name: Apply reviewed service route through surviving control path
        env:
          KUBE_API_CA: '${{ secrets.KUBE_API_CA_PEM }}'
          AUDIENCE: https://kube-api.re8ch.com/release-executor-networking
        run: |
          set -euo pipefail
          printf '%s' "$KUBE_API_CA" > "$RUNNER_TEMP/ca.crt"
          curl -fsS --get -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" > "$RUNNER_TEMP/oidc.json"
          token="$(jq -r .value "$RUNNER_TEMP/oidc.json")"; echo "::add-mask::$token"
          kubeconfig="$RUNNER_TEMP/repair.kubeconfig"
          kubectl config --kubeconfig "$kubeconfig" set-cluster re8ch --server=https://kube-api.re8ch.com:6443 \
            --certificate-authority="$RUNNER_TEMP/ca.crt" --embed-certs=true
          kubectl config --kubeconfig "$kubeconfig" set-credentials executor --token="$token"
          kubectl config --kubeconfig "$kubeconfig" set-context repair --cluster=re8ch --user=executor
          kubectl config --kubeconfig "$kubeconfig" use-context repair
          export KUBECONFIG="$kubeconfig"
          python - "$RUNNER_TEMP/api-route.yaml" <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open('clusters/re8ch/kube-api-public.yaml')) if d]
          with open(sys.argv[1], 'w') as output:
              yaml.safe_dump_all([d for d in docs if d['kind'] in ('HTTPRoute', 'BackendTLSPolicy')], output)
          PY
          kubectl apply --server-side --field-manager=networking-service-repair -f "$RUNNER_TEMP/api-route.yaml"
          index="$(kubectl -n kube-system get gateway re8ch-gateway-canary -o json | \
            jq -r '.spec.listeners | to_entries[] | select(.value.name == "kube-api-https") | .key')"
          if [[ -n "$index" ]]; then
            kubectl -n kube-system patch gateway re8ch-gateway-canary --type=json \
              -p "[{\"op\":\"remove\",\"path\":\"/spec/listeners/$index\"}]"
          fi
          kubectl -n kube-system delete tlsroute kube-api-https --ignore-not-found
          kubectl -n kube-system get httproute kube-api-service
          kubectl -n kube-system get backendtlspolicy kube-api-observer-proxy
      - name: Preserve workflow failure evidence
        if: failure()
        run: |
          python -c 'import datetime as dt,json,os; print(json.dumps({"apiVersion":"delivery.re8ch.com/workflow-failure/v1alpha1","outcome":"failed","finishedAt":dt.datetime.now(dt.timezone.utc).isoformat(),"runId":os.environ.get("GITHUB_RUN_ID"),"job":os.environ.get("GITHUB_JOB"),"health":{"status":"unknown","reason":"workflow step failed; inspect this run before trusting older accepted state"}}))' > "$RUNNER_TEMP/workflow-failure.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: 'workflow-failure-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '${{ runner.temp }}/workflow-failure.json'
          retention-days: 30
          if-no-files-found: error
