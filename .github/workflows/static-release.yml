name: static-release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish, reuse a signed digest, or reconcile the accepted artifact
        type: choice
        options: [publish, reuse, reconcile]
        default: publish
      reuse_digest:
        description: Previously published sha256 digest (required only for reuse)
        type: string
        default: ''
      reuse_source_commit:
        description: Exact certified build commit SHA for reuse
        type: string
        default: ''
      contract:
        description: Reviewed networking ReleaseContract path
        type: string
        required: true
        default: contracts/networking-native-regional-routing.yaml
      dry_run:
        description: Prove exact OIDC authorization and server-side dry-run without applying
        type: boolean
        default: false
      execute:
        description: Execute through the bounded SSA executor
        type: boolean
        default: false
      force_takeover:
        description: Force only the reviewed Helm ownership conflicts during one-time takeover
        type: boolean
        default: false
concurrency:
  group: networking-static-release-${{ inputs.contract }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      domain: ${{ steps.profile.outputs.domain }}
      environment: ${{ steps.profile.outputs.environment }}
      audience: ${{ steps.profile.outputs.audience }}
      signer: ${{ steps.profile.outputs.signer }}
      release-id: ${{ steps.profile.outputs.release-id }}
      namespace: ${{ steps.profile.outputs.namespace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - id: profile
        env: {CONTRACT: '${{ inputs.contract }}'}
        run: python operations/releases/profile.py --contract "$CONTRACT" --github-output "$GITHUB_OUTPUT"
  compile-sign:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ needs.validate.outputs.environment }}
    permissions: {contents: read, id-token: write, packages: write}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
      release-id: ${{ steps.publish.outputs.release-id }}
      namespace: ${{ steps.publish.outputs.namespace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {fetch-depth: 0}
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
        with: {version: '2.9.5'}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with: {install-dir: '${{ runner.temp }}/cosign'}
      - name: Isolate Docker credentials
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          install -d "$RUNNER_TEMP/docker-config"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - name: Install fixed protected Helm compiler
        if: inputs.contract == 'contracts/networking-helm-advanced-fabric-kube-system.yaml'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v4.2.3}
      - name: Install protected compiler SOPS
        if: inputs.contract == 'contracts/networking-helm-advanced-fabric-kube-system.yaml'
        run: |
          curl -fsSL --retry 4 https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o "$RUNNER_TEMP/sops"
          echo "620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a  $RUNNER_TEMP/sops" | sha256sum --check
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Compile reviewed Advanced Fabric into encrypted objects
        if: inputs.contract == 'contracts/networking-helm-advanced-fabric-kube-system.yaml'
        env:
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY }}'
        run: python operations/releases/compile_protected_helm.py
      - id: publish
        name: Compile, publish, sign, and verify bundle
        env: {CONTRACT: '${{ inputs.contract }}'}
        run: |
          set -euo pipefail
          case "$CONTRACT" in contracts/*.yaml) ;; *) exit 1;; esac
          readarray -t fields < <(python - "$CONTRACT" <<'PY'
          import sys,yaml
          c=yaml.safe_load(open(sys.argv[1])); s=c["spec"]
          for value in (s["source"]["renderer"],s["source"]["path"],c["metadata"]["name"],s["provenance"]["environment"],s["provenance"]["workflow"],s["authorityDomain"],s["provenance"]["signer"],s["target"]["namespace"]): print(value)
          PY
          )
          [[ "${fields[0]}" == kustomize && "${fields[1]}" != /* && "${fields[1]}" != *..* ]]
          [[ "${fields[3]}" == '${{ needs.validate.outputs.environment }}' ]]
          [[ "${fields[4]}" == .github/workflows/static-release.yml ]]
          [[ "${fields[5]}" == '${{ needs.validate.outputs.domain }}' ]]
          [[ "${fields[6]}" == '${{ needs.validate.outputs.signer }}' ]]
          if [[ "$CONTRACT" == contracts/networking-helm-advanced-fabric-kube-system.yaml ]]; then
            cp "$RUNNER_TEMP/protected-rendered.yaml" "$RUNNER_TEMP/rendered.yaml"
          else
            kubectl kustomize "${fields[1]}" > "$RUNNER_TEMP/rendered.yaml"
          fi
          python operations/releases/unified_bundle.py --contract "$CONTRACT" --rendered "$RUNNER_TEMP/rendered.yaml" \
            --output "$RUNNER_TEMP/release.bundle" > "$RUNNER_TEMP/bundle-metadata.json"
          install -d "$RUNNER_TEMP/oci"
          cp "$RUNNER_TEMP/release.bundle" "$RUNNER_TEMP/bundle-metadata.json" "$RUNNER_TEMP/oci/"
          reference="oci://ghcr.io/pillars-infra/network-gitops-release/${fields[2]}"
          flux push artifact "${reference}:run-${GITHUB_RUN_ID}" --path "$RUNNER_TEMP/oci" --reproducible \
            --source "https://github.com/${GITHUB_REPOSITORY}" --revision "main@sha1:${GITHUB_SHA}" \
            --annotations "delivery.re8ch.com/release-id=${fields[2]}" \
            --annotations "delivery.re8ch.com/mode=shadow" \
            --output json > "$RUNNER_TEMP/oci-result.json"
          oci_digest="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$RUNNER_TEMP/oci-result.json")"
          immutable="${reference#oci://}@${oci_digest}"
          cosign sign --yes "$immutable"
          # GHCR may briefly lag a just-pushed signature. Verify the same digest;
          # never rebuild or accept an unsigned artifact on publication lag.
          verified=false
          for attempt in 1 2 3 4 5; do
            if cosign verify --certificate-identity '${{ needs.validate.outputs.signer }}' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$immutable" >/dev/null; then
              verified=true
              break
            fi
            sleep "$attempt"
          done
          [[ "$verified" == true ]]
          {
            echo "digest=$oci_digest"
            echo "reference=$reference"
            echo "release-id=${fields[2]}"
            echo "namespace=${fields[7]}"
          } >> "$GITHUB_OUTPUT"
          python - "$reference" "$oci_digest" "${fields[2]}" <<'PY' > static-release-shadow-evidence.json
          import json,sys
          print(json.dumps({"reference":sys.argv[1],"digest":sys.argv[2],"releaseId":sys.argv[3],"mode":"shadow","verified":True},sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'static-release-shadow-${{ github.run_id }}', path: static-release-shadow-evidence.json, retention-days: 30, if-no-files-found: error}
  runtime-dry-run:
    if: always() && inputs.dry_run && !inputs.execute && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && (needs.compile-sign.result == 'success' || (inputs.mode != 'publish' && needs.compile-sign.result == 'skipped'))
    needs: [validate, compile-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.validate.outputs.environment }}
    permissions: {contents: read, id-token: write, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {fetch-depth: 0}
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
        with: {version: '2.9.5'}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with: {install-dir: '${{ runner.temp }}/cosign'}
      - name: Isolate Docker credentials
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          install -d "$RUNNER_TEMP/docker-config"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - name: Install pinned SOPS
        run: |
          curl -fsSL --retry 4 https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o "$RUNNER_TEMP/sops"
          echo "620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a  $RUNNER_TEMP/sops" | sha256sum --check
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Acquire exact OIDC identity
        env:
          KUBE_API_CA: '${{ secrets.KUBE_API_CA_PEM }}'
          EXECUTOR_AUDIENCE: '${{ needs.validate.outputs.audience }}'
        run: |
          set -euo pipefail
          printf '%s' "$KUBE_API_CA" > "$RUNNER_TEMP/re8ch-ca.crt"
          curl -fsS --get -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=$EXECUTOR_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" > "$RUNNER_TEMP/oidc.json"
          token="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["value"])' "$RUNNER_TEMP/oidc.json")"
          echo "::add-mask::$token"
          kubeconfig="$RUNNER_TEMP/executor.kubeconfig"
          kubectl config --kubeconfig "$kubeconfig" set-cluster re8ch-main --server=https://kube-api.re8ch.com:6443 \
            --certificate-authority="$RUNNER_TEMP/re8ch-ca.crt" --embed-certs=true
          kubectl config --kubeconfig "$kubeconfig" set-credentials release-executor --token="$token"
          kubectl config --kubeconfig "$kubeconfig" set-context release-executor --cluster=re8ch-main --user=release-executor
          kubectl config --kubeconfig "$kubeconfig" use-context release-executor
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          echo "EXECUTOR_AUDIENCE=$EXECUTOR_AUDIENCE" >> "$GITHUB_ENV"
      - name: Verify signed artifact and perform bounded server-side preflight
        env:
          CONTRACT: '${{ inputs.contract }}'
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY }}'
          OCI_REFERENCE: '${{ needs.compile-sign.outputs.reference }}'
          OCI_DIGEST: '${{ needs.compile-sign.outputs.digest }}'
          REUSE_DIGEST: '${{ inputs.reuse_digest }}'
          REUSE_SOURCE_COMMIT: '${{ inputs.reuse_source_commit }}'
          RELEASE_ID: '${{ needs.validate.outputs.release-id }}'
          TARGET_NAMESPACE: '${{ needs.validate.outputs.namespace }}'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/executor-state"
          install -d "$RUNNER_TEMP/pulled" "$root/state" "$root/results/$RELEASE_ID"
          state_name="$(python operations/releases/operation_materialize.py state-name --release-id "$RELEASE_ID")"
          kubectl get configmap "$state_name" -n "$TARGET_NAMESPACE" -o json > "$RUNNER_TEMP/state-cm.json"
          verify_args=()
          if [[ '${{ inputs.mode }}' == reconcile ]]; then
            python operations/releases/operation_materialize.py accepted-bundle --configmap "$RUNNER_TEMP/state-cm.json" --contract "$CONTRACT" > "$RUNNER_TEMP/accepted.json"
            OCI_REFERENCE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["reference"])' "$RUNNER_TEMP/accepted.json")"
            OCI_DIGEST="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$RUNNER_TEMP/accepted.json")"
          elif [[ '${{ inputs.mode }}' == reuse ]]; then
            [[ "$REUSE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            python operations/releases/verify_reuse_source.py --commit "$REUSE_SOURCE_COMMIT" --contract "$CONTRACT"
            verify_args+=(--certificate-github-workflow-sha "$REUSE_SOURCE_COMMIT")
            OCI_REFERENCE="oci://ghcr.io/pillars-infra/network-gitops-release/$RELEASE_ID"
            OCI_DIGEST="$REUSE_DIGEST"
          fi
          immutable="${OCI_REFERENCE#oci://}@${OCI_DIGEST}"
          cosign verify --certificate-identity '${{ needs.validate.outputs.signer }}' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${verify_args[@]}" "$immutable" >/dev/null
          flux pull artifact "${OCI_REFERENCE}@${OCI_DIGEST}" --output "$RUNNER_TEMP/pulled"
          python operations/releases/operation_materialize.py hydrate --configmap "$RUNNER_TEMP/state-cm.json" --state-dir "$root" --release-id "$RELEASE_ID"
          request_args=(request --contract "$CONTRACT" --metadata "$RUNNER_TEMP/pulled/bundle-metadata.json" \
            --state-dir "$root" --reference "$OCI_REFERENCE" --digest "$OCI_DIGEST" --output "$RUNNER_TEMP/operation.json")
          if [[ '${{ inputs.force_takeover }}' == true ]]; then
            request_args+=(--action force-reconcile)
            while IFS= read -r object; do request_args+=(--force-object "$object"); done < <(
              python - "$CONTRACT" <<'PY'
          import sys,yaml
          for value in yaml.safe_load(open(sys.argv[1]))["spec"]["authorization"].get("forceConflictObjects", []): print(value)
          PY
            )
          fi
          python operations/releases/operation_materialize.py "${request_args[@]}"
          python operations/releases/ssa_preflight.py --contract "$CONTRACT" --operation "$RUNNER_TEMP/operation.json" \
            --bundle "$RUNNER_TEMP/pulled/release.bundle" --state-dir "$root" > static-release-preflight.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: 'static-release-preflight-${{ github.run_id }}', path: static-release-preflight.json, retention-days: 30, if-no-files-found: warn}
  execute:
    concurrency:
      group: networking-runtime-write
      queue: max
      cancel-in-progress: false
    if: always() && inputs.execute && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && (needs.compile-sign.result == 'success' || (inputs.mode != 'publish' && needs.compile-sign.result == 'skipped'))
    needs: [validate, compile-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.validate.outputs.environment }}
    permissions: {contents: read, id-token: write, packages: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: {fetch-depth: 0}
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
        with: {version: '2.9.5'}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with: {install-dir: '${{ runner.temp }}/cosign'}
      - name: Isolate Docker credentials
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          install -d "$RUNNER_TEMP/docker-config"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - name: Install pinned SOPS
        run: |
          curl -fsSL --retry 4 https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o "$RUNNER_TEMP/sops"
          echo "620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a  $RUNNER_TEMP/sops" | sha256sum --check
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Acquire exact OIDC identity
        env:
          KUBE_API_CA: '${{ secrets.KUBE_API_CA_PEM }}'
          EXECUTOR_AUDIENCE: '${{ needs.validate.outputs.audience }}'
        run: |
          set -euo pipefail
          printf '%s' "$KUBE_API_CA" > "$RUNNER_TEMP/re8ch-ca.crt"
          curl -fsS --get -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=$EXECUTOR_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" > "$RUNNER_TEMP/oidc.json"
          token="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["value"])' "$RUNNER_TEMP/oidc.json")"
          echo "::add-mask::$token"
          kubeconfig="$RUNNER_TEMP/executor.kubeconfig"
          kubectl config --kubeconfig "$kubeconfig" set-cluster re8ch-main --server=https://kube-api.re8ch.com:6443 \
            --certificate-authority="$RUNNER_TEMP/re8ch-ca.crt" --embed-certs=true
          kubectl config --kubeconfig "$kubeconfig" set-credentials release-executor --token="$token"
          kubectl config --kubeconfig "$kubeconfig" set-context release-executor --cluster=re8ch-main --user=release-executor
          kubectl config --kubeconfig "$kubeconfig" use-context release-executor
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          echo "EXECUTOR_AUDIENCE=$EXECUTOR_AUDIENCE" >> "$GITHUB_ENV"
      - name: Pull signed digest, resume durable state and reconcile
        env:
          CONTRACT: '${{ inputs.contract }}'
          SOPS_AGE_KEY: '${{ secrets.SOPS_AGE_KEY }}'
          OCI_REFERENCE: '${{ needs.compile-sign.outputs.reference }}'
          OCI_DIGEST: '${{ needs.compile-sign.outputs.digest }}'
          REUSE_DIGEST: '${{ inputs.reuse_digest }}'
          REUSE_SOURCE_COMMIT: '${{ inputs.reuse_source_commit }}'
          RELEASE_ID: '${{ needs.validate.outputs.release-id }}'
          TARGET_NAMESPACE: '${{ needs.validate.outputs.namespace }}'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/executor-state"
          install -d "$RUNNER_TEMP/pulled" "$root/state" "$root/results/$RELEASE_ID"
          state_name="$(python operations/releases/operation_materialize.py state-name --release-id "$RELEASE_ID")"
          kubectl get configmap "$state_name" -n "$TARGET_NAMESPACE" -o json > "$RUNNER_TEMP/state-cm.json"
          verify_args=()
          if [[ '${{ inputs.mode }}' == reconcile ]]; then
            python operations/releases/operation_materialize.py accepted-bundle --configmap "$RUNNER_TEMP/state-cm.json" --contract "$CONTRACT" > "$RUNNER_TEMP/accepted.json"
            OCI_REFERENCE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["reference"])' "$RUNNER_TEMP/accepted.json")"
            OCI_DIGEST="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$RUNNER_TEMP/accepted.json")"
          elif [[ '${{ inputs.mode }}' == reuse ]]; then
            [[ "$REUSE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            python operations/releases/verify_reuse_source.py --commit "$REUSE_SOURCE_COMMIT" --contract "$CONTRACT"
            verify_args+=(--certificate-github-workflow-sha "$REUSE_SOURCE_COMMIT")
            OCI_REFERENCE="oci://ghcr.io/pillars-infra/network-gitops-release/$RELEASE_ID"
            OCI_DIGEST="$REUSE_DIGEST"
          fi
          immutable="${OCI_REFERENCE#oci://}@${OCI_DIGEST}"
          cosign verify --certificate-identity '${{ needs.validate.outputs.signer }}' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${verify_args[@]}" "$immutable" >/dev/null
          flux pull artifact "${OCI_REFERENCE}@${OCI_DIGEST}" --output "$RUNNER_TEMP/pulled"
          python operations/releases/operation_materialize.py hydrate --configmap "$RUNNER_TEMP/state-cm.json" --state-dir "$root" --release-id "$RELEASE_ID"
          request_args=(request --contract "$CONTRACT" --metadata "$RUNNER_TEMP/pulled/bundle-metadata.json" \
            --state-dir "$root" --reference "$OCI_REFERENCE" --digest "$OCI_DIGEST" --output "$RUNNER_TEMP/operation.json")
          if [[ '${{ inputs.force_takeover }}' == true ]]; then
            request_args+=(--action force-reconcile)
            while IFS= read -r object; do request_args+=(--force-object "$object"); done < <(
              python - "$CONTRACT" <<'PY'
          import sys,yaml
          for value in yaml.safe_load(open(sys.argv[1]))["spec"]["authorization"].get("forceConflictObjects", []): print(value)
          PY
            )
          fi
          python operations/releases/operation_materialize.py "${request_args[@]}"
          executor_status=0
          python operations/releases/ssa_executor.py --contract "$CONTRACT" --operation "$RUNNER_TEMP/operation.json" \
            --bundle "$RUNNER_TEMP/pulled/release.bundle" --state-dir "$root" > "$RUNNER_TEMP/result.json" || executor_status=$?
          python operations/releases/operation_materialize.py state-patch --configmap "$RUNNER_TEMP/state-cm.json" \
            --state-dir "$root" --release-id "$RELEASE_ID" --result "$RUNNER_TEMP/result.json" --output "$RUNNER_TEMP/state-patch.json"
          if [[ -s "$RUNNER_TEMP/state-patch.json" ]]; then
            # Refresh the outer kubectl identity after potentially long health checks.
            python operations/releases/refresh_kubeconfig.py
            kubectl patch configmap "$state_name" -n "$TARGET_NAMESPACE" --type merge --patch-file "$RUNNER_TEMP/state-patch.json"
          fi
          cp "$RUNNER_TEMP/result.json" static-release-result.json
          exit "$executor_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: 'static-release-result-${{ github.run_id }}', path: static-release-result.json, retention-days: 30, if-no-files-found: warn}
