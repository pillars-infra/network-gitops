apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-cert-manager
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: cert-manager
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-cert-manager
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/networking-native-cert-manager
    resources:
    - core/ServiceAccount
    objectNames:
    - cert-manager-cloudflare-bootstrap
    forceConflictObjects:
    - core/ServiceAccount/cert-manager/cert-manager-cloudflare-bootstrap
  inventory:
    digest: sha256:c26c664015b63120ed67ff27fe7e3f57003e11c18bf86b7454819b0f84befaf1
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
