apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-atlantic-bootstrap
spec:
  authorityDomain: networking
  target:
    cluster: re8ch-atlantic
    namespace: atlantic-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-atlantic-bootstrap
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking-atlantic
    audience: https://kube-api.re8ch.com/release-executor-networking-atlantic
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-atlantic-bootstrap
    resources:
    - core/ConfigMap
    objectNames:
    - atlantic-cluster-profile
    forceConflictObjects:
    - core/ConfigMap/atlantic-system/atlantic-cluster-profile
  inventory:
    digest: sha256:cb3ae8222a151870d9024c4ad6997d306cc1ba2869f3f0a419d5db87b4f1cdaa
  lifecycle:
    prune: false
    healthTimeoutSeconds: 120
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
