apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-re8ch-secretary
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: re8ch-secretary
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-re8ch-secretary
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-re8ch-secretary
    resources:
    - gateway.networking.k8s.io/HTTPRoute
    objectNames:
    - tools-service-secretary-webhooks
    forceConflictObjects:
    - gateway.networking.k8s.io/HTTPRoute/re8ch-secretary/tools-service-secretary-webhooks
  inventory:
    digest: sha256:5215c731d5fce6dc8832ea9529267b8dfc2ff7da5b2b9c1f1c35de16acff1246
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
