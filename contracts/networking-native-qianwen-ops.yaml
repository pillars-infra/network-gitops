apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-qianwen-ops
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: qianwen-ops
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-qianwen-ops
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/networking-native-qianwen-ops
    resources:
    - apps/Deployment
    - core/Service
    - core/ServiceAccount
    - networking.k8s.io/Ingress
    objectNames:
    - external-dns-cloudflare
    - tenant-apps-dns-placeholder
    - tenant-apps-wildcard-dns-authority
    forceConflictObjects:
    - apps/Deployment/qianwen-ops/external-dns-cloudflare
    - core/Service/qianwen-ops/tenant-apps-dns-placeholder
    - core/ServiceAccount/qianwen-ops/external-dns-cloudflare
    - networking.k8s.io/Ingress/qianwen-ops/tenant-apps-wildcard-dns-authority
  inventory:
    digest: sha256:32b825715f424a486a737c3e565aa7eded889bb882e281041498d61ffb58ea48
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
