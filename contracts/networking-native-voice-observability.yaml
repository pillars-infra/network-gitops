apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-voice-observability
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: voice-observability
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-voice-observability
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-voice-observability
    resources:
    - gateway.networking.k8s.io/HTTPRoute
    objectNames:
    - phonycenter-public
    - phonycenter-service-public
    forceConflictObjects:
    - gateway.networking.k8s.io/HTTPRoute/voice-observability/phonycenter-public
    - gateway.networking.k8s.io/HTTPRoute/voice-observability/phonycenter-service-public
  inventory:
    digest: sha256:a11d4e7c27d16c5b59e8ddf1322fc66b4b8659bb4836098cc542e97616b5ffd2
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
