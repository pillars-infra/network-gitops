apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-flux-network-system
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: flux-network-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-flux-network-system
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-flux-network-system
    resources:
    - core/ConfigMap
    objectNames:
    - cluster-node-inventory
    forceConflictObjects:
    - core/ConfigMap/flux-network-system/cluster-node-inventory
  inventory:
    digest: sha256:6206ebb0b72cc7ccfc186d1e3f71739e2db1fd00081a4e079a51bad9eff42ca4
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
