apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-ops
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: ops
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-ops
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/networking-native-ops
    resources:
    - apps/Deployment
    - core/ConfigMap
    - gateway.networking.k8s.io/HTTPRoute
    objectNames:
    - dbgui-service-public
    - routeros-public-forward-controller
    - routeros-transit-controller
    forceConflictObjects:
    - apps/Deployment/ops/routeros-public-forward-controller
    - apps/Deployment/ops/routeros-transit-controller
    - core/ConfigMap/ops/routeros-public-forward-controller
    - gateway.networking.k8s.io/HTTPRoute/ops/dbgui-service-public
  inventory:
    digest: sha256:4c5fa75a8490bec4ac545697c8e6d93761602f8d0896432589e3757eca0d943d
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
