apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-advfab-system
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: advfab-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-advfab-system
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/networking-native-advfab-system
    resources:
    - apps/Deployment
    - core/ServiceAccount
    objectNames:
    - external-dns-advfab
    forceConflictObjects:
    - apps/Deployment/advfab-system/external-dns-advfab
    - core/ServiceAccount/advfab-system/external-dns-advfab
  inventory:
    digest: sha256:24638993a5d018777ca38717a11b270862dfc0a784a38714e0726c27ab5c73f4
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
