apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-mail-system
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: mail-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-mail-system
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-mail-system
    resources:
    - gateway.networking.k8s.io/HTTPRoute
    objectNames:
    - service-zone-mail-stalwart-webmail-public
    - service-zone-mail-stalwart-webmail-redirect
    forceConflictObjects:
    - gateway.networking.k8s.io/HTTPRoute/mail-system/service-zone-mail-stalwart-webmail-public
    - gateway.networking.k8s.io/HTTPRoute/mail-system/service-zone-mail-stalwart-webmail-redirect
  inventory:
    digest: sha256:be04772dd901153df5d3ea8da215a5aa171f8fca91319122bfce74e298db610a
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
