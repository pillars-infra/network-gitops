apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-flux-system
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: flux-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-flux-system
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-flux-system
    resources:
    - core/ServiceAccount
    - gateway.networking.k8s.io/HTTPRoute
    objectNames:
    - among-clusters-legacy-agent-cleanup
    - service-zone-hooks-github-flux-webhook
    forceConflictObjects:
    - core/ServiceAccount/flux-system/among-clusters-legacy-agent-cleanup
    - gateway.networking.k8s.io/HTTPRoute/flux-system/service-zone-hooks-github-flux-webhook
  inventory:
    digest: sha256:b9b56aa964548818fc46a16ebadc59de0efa2dcb3413d3c34cb5dd7f482077d3
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
