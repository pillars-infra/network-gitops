apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-kube-api
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: kube-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-kube-api
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-kube-api
    resources:
    - apps/Deployment
    - core/ConfigMap
    - core/Service
    - gateway.networking.k8s.io/BackendTLSPolicy
    - gateway.networking.k8s.io/HTTPRoute
    objectNames:
    - kube-api-observer-proxy
    - kube-api-service
    forceConflictObjects:
    - apps/Deployment/kube-system/kube-api-observer-proxy
    - core/ConfigMap/kube-system/kube-api-observer-proxy
    - core/Service/kube-system/kube-api-observer-proxy
    - gateway.networking.k8s.io/BackendTLSPolicy/kube-system/kube-api-observer-proxy
    - gateway.networking.k8s.io/HTTPRoute/kube-system/kube-api-service
  inventory:
    digest: sha256:f028a21138cf2675b1bb6a2b6bc6a13692fecb988454a3d4640edbee34fba357
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
