apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: networking-native-opensandbox-system
spec:
  authorityDomain: networking
  target:
    cluster: re8ch
    namespace: opensandbox-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: pillars-infra/network-gitops
    path: releases/networking-native-opensandbox-system
  provenance:
    repository: pillars-infra/network-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-networking
    audience: https://kube-api.re8ch.com/release-executor-networking
    signer: https://github.com/pillars-infra/network-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    requireExisting: true
    fieldManager: re8ch-release/networking-native-opensandbox-system
    resources:
    - gateway.networking.k8s.io/HTTPRoute
    - networking.k8s.io/Ingress
    objectNames:
    - opensandbox-server
    - opensandbox-service-public
    forceConflictObjects:
    - gateway.networking.k8s.io/HTTPRoute/opensandbox-system/opensandbox-service-public
    - networking.k8s.io/Ingress/opensandbox-system/opensandbox-server
  inventory:
    digest: sha256:542c660629dad14de0edb82dd0e2f590cd262afcc4b2f935c53291a443d04c29
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
